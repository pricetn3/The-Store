<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ data.wrap }}">
  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
    <div style="min-width: 0;">
      <h2 style="font: var(--fw-semibold) 16px/22px var(--font-display); color: var(--gray-900); margin: 0 0 3px;">{{ data.title }}</h2>
      <p style="font: var(--fw-regular) 13px/18px var(--font-body); color: var(--gray-500); margin: 0;">{{ data.subtitle }}</p>
    </div>
    <sc-if value="{{ data.view }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ data.onEdit }}" style="{{ data.btnEdit }}" style-hover="{{ data.btnSecondaryHover }}" style-focus="{{ data.focusRing }}">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        Edit
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ data.view }}" hint-placeholder-val="{{ true }}">
    <div style="font: var(--fw-medium) 15px/22px var(--font-body); color: var(--gray-900); margin-top: 14px;">{{ data.email }}</div>
  </sc-if>

  <sc-if value="{{ data.edit }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 14px;">
      <div>
        <span style="display: block; font: var(--fw-medium) 13px/18px var(--font-body); color: var(--gray-700); margin-bottom: 6px;">Current email</span>
        <div style="font: var(--fw-medium) 15px/22px var(--font-body); color: var(--gray-900);">{{ data.email }}</div>
      </div>

      <label style="display: block;">
        <span style="display: block; font: var(--fw-medium) 13px/18px var(--font-body); color: var(--gray-700); margin-bottom: 6px;">New email</span>
        <input value="{{ data.newVal }}" onChange="{{ data.onNew }}" type="email" autoComplete="email" style="{{ data.newInputStyle }}" style-focus="{{ data.inputFocus }}">
        <sc-if value="{{ data.newErr }}" hint-placeholder-val="{{ false }}">
          <span style="display: inline-flex; align-items: center; gap: 5px; font: var(--fw-medium) 12px/17px var(--font-body); color: var(--error-700); margin-top: 6px;">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--error-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
            {{ data.newErrMsg }}
          </span>
        </sc-if>
      </label>

      <label style="display: block;">
        <span style="display: block; font: var(--fw-medium) 13px/18px var(--font-body); color: var(--gray-700); margin-bottom: 6px;">Confirm new email</span>
        <input value="{{ data.confVal }}" onChange="{{ data.onConf }}" type="email" autoComplete="email" style="{{ data.confInputStyle }}" style-focus="{{ data.inputFocus }}">
        <sc-if value="{{ data.confErr }}" hint-placeholder-val="{{ false }}">
          <span style="display: inline-flex; align-items: center; gap: 5px; font: var(--fw-medium) 12px/17px var(--font-body); color: var(--error-700); margin-top: 6px;">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--error-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
            {{ data.confErrMsg }}
          </span>
        </sc-if>
        <sc-if value="{{ data.confOk }}" hint-placeholder-val="{{ false }}">
          <span style="display: inline-flex; align-items: center; gap: 5px; font: var(--fw-medium) 12px/17px var(--font-body); color: var(--success-700); margin-top: 6px;">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--success-500)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
            Emails match
          </span>
        </sc-if>
      </label>

      <div style="border-top: 1px solid var(--gray-100); padding-top: 14px;">
        <label style="display: block;">
          <span style="display: flex; align-items: center; gap: 6px; font: var(--fw-medium) 13px/18px var(--font-body); color: var(--gray-700); margin-bottom: 6px;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--gray-500)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Confirm your password
          </span>
          <input value="{{ data.pwVal }}" onChange="{{ data.onPw }}" type="password" autoComplete="current-password" placeholder="Enter your current password" style="{{ data.inputStyle }}" style-focus="{{ data.inputFocus }}">
        </label>
        <p style="font: var(--fw-regular) 12px/17px var(--font-body); color: var(--gray-500); margin: 8px 2px 0; text-wrap: pretty;">Changing your email is a sensitive account change, so we ask you to confirm it's you. The new address takes effect once you verify it from your inbox.</p>
      </div>

      <div style="{{ data.footer }}">
        <button onClick="{{ data.onCancel }}" style="{{ data.btnSecondary }}" style-hover="{{ data.btnSecondaryHover }}" style-focus="{{ data.focusRing }}">Cancel</button>
        <button onClick="{{ data.onSave }}" aria-disabled="{{ data.saveAria }}" style="{{ data.saveStyle }}" style-hover="{{ data.btnPrimaryHover }}" style-focus="{{ data.focusRing }}">Save changes</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:420}}"></script>
</body>
</html>
