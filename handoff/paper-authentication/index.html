<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credential authenticated | Paradigm</title>
  <!--
    Preview only. Runs PaperAuthentication.tsx in the browser with no build
    step so the page can be reviewed on GitHub Pages. Developers use the
    .tsx and .module.css files directly; this file isn't part of the handoff.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../design-system/tokens.css">
  <link rel="stylesheet" href="../../design-system/components.css">
  <link rel="stylesheet" href="PaperAuthentication.module.css">
  <style>body { margin: 0; }</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script>
    (async () => {
      const source = await (await fetch('PaperAuthentication.tsx')).text();
      const { code } = Babel.transform(source, {
        filename: 'PaperAuthentication.tsx',
        presets: [['typescript', { isTSX: true, allExtensions: true }], ['react', { runtime: 'automatic' }]],
        plugins: ['transform-modules-commonjs'],
      });

      // Stand-ins for what a bundler normally provides.
      const jsx = (type, props, key) => React.createElement(type, key === undefined ? props : { ...props, key });
      const modules = {
        'react/jsx-runtime': { jsx, jsxs: jsx, Fragment: React.Fragment },
        // The stylesheet is loaded above as plain CSS, so each module class name maps to itself.
        './PaperAuthentication.module.css': { __esModule: true, default: new Proxy({}, { get: (_, name) => name }) },
      };
      const require = (path) => modules[path] || (path.startsWith('./assets/') ? { __esModule: true, default: path.slice(2) } : null);
      const module = { exports: {} };
      new Function('require', 'module', 'exports', code)(require, module, module.exports);

      // Sample data: the same credential as the Claude Design prototype.
      ReactDOM.createRoot(document.getElementById('root')).render(
        React.createElement(module.exports.PaperAuthentication, {
          institution: { name: 'Virginia Hanock University', logoUrl: 'assets/vhu-logo.svg', accentColor: '#0086C4' },
          recipientName: 'Maya Wright',
          conferralDate: '2026-03-16',
          publisher: 'Paradigm, Inc.',
          accessedAt: new Date(2026, 9, 12, 9, 20),
          accessHref: '../../auth-flow.dc.html?state=expired&src=scan&open=first',
        })
      );
    })();
  </script>
</body>
</html>
