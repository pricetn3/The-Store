<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="assets/cc-tokens.css">
<script src="./image-slot.js"></script>
<style>
  :root { --surface: #fff; }
  @keyframes cc-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes cc-toast { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .stg-fade { animation: cc-fade-in 200ms cubic-bezier(0.2, 0.6, 0.2, 1) both; }
  @keyframes cc-fade-in { from { opacity: 0; } to { opacity: 1; } }
  [data-tab-key]:not([aria-current="page"]):hover { background: var(--gray-100) !important; }
</style>
</helmet>

<div style="width: 100%; font-family: var(--font-body); color: var(--gray-900);">
  <div style="display: flex; align-items: center; gap: 18px; margin-bottom: 24px;">
    <div style="position: relative; flex-shrink: 0;">
      <span style="{{ avatarStyle }}" aria-hidden="true">{{ avatarInitials }}</span>
      <sc-if value="{{ noAvatar }}" hint-placeholder-val="{{ true }}">
        <label style="{{ avatarBadge }}" style-hover="{{ avatarBadgeHover }}" title="Add profile photo">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
          <input type="file" accept="image/*" onChange="{{ onAvatarFile }}" style="{{ srOnly }}">
          <span style="{{ srOnly }}">Add profile photo</span>
        </label>
      </sc-if>
      <sc-if value="{{ hasAvatar }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ onToggleAvatarMenu }}" aria-haspopup="menu" aria-label="Edit profile photo" style="{{ avatarBadge }}" style-hover="{{ avatarBadgeHover }}" style-focus="{{ focusRing }}">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        </button>
        <sc-if value="{{ avatarMenuOpen }}" hint-placeholder-val="{{ false }}">
          <div role="menu" style="{{ avatarMenuStyle }}">
            <label role="menuitem" style="{{ avatarMenuItem }}" style-hover="{{ avatarMenuHover }}">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--gray-500)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z"></path><circle cx="12" cy="13" r="3"></circle></svg>
              Replace photo
              <input type="file" accept="image/*" onChange="{{ onAvatarFile }}" style="{{ srOnly }}">
            </label>
            <button role="menuitem" onClick="{{ onRemoveAvatar }}" style="{{ avatarMenuDanger }}" style-hover="{{ avatarMenuHover }}" style-focus="{{ focusRing }}">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M6 6v14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6"></path></svg>
              Remove photo
            </button>
          </div>
        </sc-if>
      </sc-if>
    </div>
    <div style="min-width: 0;">
      
      <h1 style="font: var(--fw-semibold) var(--text-display-xs-size)/var(--text-display-xs-lh) var(--font-display); color: var(--gray-900); margin: 0 0 5px;">Settings</h1>
      <p style="font: var(--fw-regular) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-600); margin: 0; text-wrap: pretty;">Manage your affiliations, sign-in details, and personal information.</p>
    </div>
  </div>

  <div style="{{ pageGridStyle }}">
    <div style="{{ tabsColStyle }}">
      <sc-for list="{{ settingsTabs }}" as="t" hint-placeholder-count="2">
        <button onClick="{{ t.onClick }}" aria-current="{{ t.current }}" data-tab-key="{{ t.key }}" style="{{ t.style }}" style-hover="{{ t.hover }}" style-focus="{{ focusRing }}">
          <sc-if value="{{ t.showIconChip }}" hint-placeholder-val="{{ true }}">
          <span style="{{ t.iconChipStyle }}" aria-hidden="true">
            <sc-if value="{{ t.isAccount }}" hint-placeholder-val="{{ true }}">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </sc-if>
            <sc-if value="{{ t.isOrganizations }}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor"><path d="M4.16675 8.33331V13.3426C4.16675 13.6417 4.16675 13.7913 4.21229 13.9233C4.25257 14.0401 4.3183 14.1465 4.40473 14.2347C4.50247 14.3345 4.63625 14.4014 4.9038 14.5352L9.4038 16.7852C9.62243 16.8945 9.73175 16.9491 9.84642 16.9707C9.94797 16.9897 10.0522 16.9897 10.1537 16.9707C10.2684 16.9491 10.3777 16.8945 10.5964 16.7852L15.0964 14.5352C15.3639 14.4014 15.4977 14.3345 15.5954 14.2347C15.6819 14.1465 15.7476 14.0401 15.7879 13.9233C15.8334 13.7913 15.8334 13.6417 15.8334 13.3426V8.33331M1.66675 7.08331L9.70194 3.06571C9.81126 3.01105 9.86592 2.98372 9.92325 2.97297C9.97403 2.96344 10.0261 2.96344 10.0769 2.97297C10.1342 2.98372 10.1889 3.01105 10.2982 3.06571L18.3334 7.08331L10.2982 11.1009C10.1889 11.1556 10.1342 11.1829 10.0769 11.1936C10.0261 11.2032 9.97403 11.2032 9.92325 11.1936C9.86592 11.1829 9.81126 11.1556 9.70194 11.1009L1.66675 7.08331Z" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </sc-if>
          </span>
          </sc-if>
          <span style="min-width: 0;">
            <span style="{{ t.titleStyle }}">{{ t.label }}</span>
            <sc-if value="{{ t.showSubtitle }}" hint-placeholder-val="{{ true }}">
              <span style="{{ t.subtitleStyle }}">{{ t.subtitle }}</span>
            </sc-if>
          </span>
        </button>
      </sc-for>
    </div>

    <div style="min-width: 0; flex: 1;">
    <sc-if value="{{ tabIsAccount }}" hint-placeholder-val="{{ true }}">
    <div style="{{ gridStyle }}">
      <div style="background: var(--surface); border: 1px solid var(--gray-200); border-radius: 12px; box-shadow: var(--shadow-xs); padding: 24px 24px 26px;">
        <dc-import name="Settings Personal" data="{{ personalVM }}" hint-size="100%,200px"></dc-import>
      </div>
      <div data-lz="address" style="background: var(--surface); border: 1px solid var(--gray-200); border-radius: 12px; box-shadow: var(--shadow-xs); padding: 24px 24px 26px; min-height: 132px;">
        <sc-if value="{{ lzAddress }}" hint-placeholder-val="{{ true }}">
          <div class="stg-fade"><dc-import name="Settings Address" data="{{ addressVM }}" hint-size="100%,200px"></dc-import></div>
        </sc-if>
      </div>
      <div data-lz="password" style="background: var(--surface); border: 1px solid var(--gray-200); border-radius: 12px; box-shadow: var(--shadow-xs); padding: 24px 24px 26px; min-height: 64px;">
        <sc-if value="{{ lzPassword }}" hint-placeholder-val="{{ true }}">
          <div class="stg-fade"><dc-import name="Settings Password" data="{{ passwordVM }}" hint-size="100%,120px"></dc-import></div>
        </sc-if>
      </div>
    </div>
    </sc-if>

    <sc-if value="{{ tabIsOrganizations }}" hint-placeholder-val="{{ false }}">
    <div class="stg-fade" style="max-width: 640px;">
      <dc-import name="Organizations Page" hint-size="100%,300px"></dc-import>
    </div>
    </sc-if>
    </div>
  </div>

  <sc-if value="{{ toastShow }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 200; display: inline-flex; align-items: center; gap: 10px; background: var(--cc-navy); color: #fff; border-radius: 999px; padding: 11px 18px 11px 14px; box-shadow: var(--shadow-2xl); animation: cc-toast 0.24s cubic-bezier(0.2,0.6,0.2,1);">
      <span style="width: 22px; height: 22px; border-radius: 999px; background: var(--success-500); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>
      <span style="font: var(--fw-medium) var(--text-sm-size)/var(--text-sm-lh) var(--font-body);">{{ toastText }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:720},&quot;addressVerifyActive&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Mailing address&quot;}}">
class Component extends DCLogic {
  PREVIOUS_PASSWORDS = ["Password123!", "Sunshine22$", "Blueberry9#", "Charlottesville1!", "Wildcat88@"];
  // below-the-fold settings cards mount as they near the viewport, so the page
  // paints its own chrome first instead of flashing placeholder blocks
  observeLz() {
    if (typeof IntersectionObserver === "undefined") { this._lzAll = true; return; }
    if (!this._lzIO) {
      this._lzIO = new IntersectionObserver((ents) => {
        const hit = [];
        ents.forEach((en) => {
          if (!en.isIntersecting) return;
          hit.push(en.target.getAttribute("data-lz"));
          this._lzIO.unobserve(en.target);
        });
        if (hit.length) this.setState((st) => {
          const next = Object.assign({}, st.lzSeen);
          hit.forEach((k) => { next[k] = true; });
          return { lzSeen: next };
        });
      }, { rootMargin: "300px 0px" });
    }
    const root = this._rootEl || document;
    root.querySelectorAll("[data-lz]").forEach((n) => {
      if (!(this.state.lzSeen || {})[n.getAttribute("data-lz")]) this._lzIO.observe(n);
    });
  }
  state = {
    lzSeen: {},
    isDesktop: true,
    edit: null,              // { kind:'email'|'password'|'user'|'addr-add'|'addr-edit', id? }
    linkStub: false,
    linkValue: "",
    toast: null,
    email: "maya.wright@gmail.com",
    emailDraft: { new: "", conf: "", pw: "" },
    pwDraft: { cur: "", new: "", conf: "" },
    showCur: false, showNew: false, showConf: false, signOut: true,
    user: { first: "Maya", last: "Wright", phone: "(434) 555-0192" },
    userDraft: { first: "", last: "", phone: "" },
    // single mailing address per student — on migration we keep the address the student last
    // ordered to (the former default) and discard the rest
    address: { first: "Maya", last: "Wright", street: "1842 Cedar Ridge Lane", apt: "", city: "Charlottesville", state: "VA", zip: "22903", country: "United States" },
    addrDraft: null,
    pwLastChanged: "14 May, 2026",
    addressVerify: null,
    settingsTab: "account",
  };

  INST_DOMAINS = ["virginiahanock.edu", "northlakepoly.edu", "meridianhealth.edu"];

  componentDidUpdate(prevProps) {
    this.observeLz();
    if (prevProps.addressVerifyActive !== this.props.addressVerifyActive) this.syncVerifyProp();
    if (prevProps.navKey !== this.props.navKey && this.props.navKey) {
      const tab = String(this.props.navKey).split("#")[0];
      this.applyNavKey(tab);
    }
  }
  syncVerifyProp() {
    const on = this.props.addressVerifyActive ?? true;
    this.setState({ addressVerify: on ? { status: "pending", closesLabel: "September 2, 2026", daysRemaining: 7 } : null });
  }
  componentDidMount() {
    this._mq = window.matchMedia("(min-width: 820px)");
    this._onMq = (e) => this.setState({ isDesktop: e.matches });
    this.setState({ isDesktop: this._mq.matches });
    this._mq.addEventListener ? this._mq.addEventListener("change", this._onMq) : this._mq.addListener(this._onMq);
    this.observeLz();
    this.syncVerifyProp();
    if (this.props.navKey) {
      const tab = String(this.props.navKey).split("#")[0];
      this.applyNavKey(tab);
    }
  }
  setSettingsTab = (tab) => () => this.setState({ settingsTab: tab });
  componentWillUnmount() {
    if (this._mq) { this._mq.removeEventListener ? this._mq.removeEventListener("change", this._onMq) : this._mq.removeListener(this._onMq); }
    if (this._toastT) clearTimeout(this._toastT);
  }

  onAvatarFile = (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      if (this.props.onAvatarChange) this.props.onAvatarChange(r.result);
      this.setState({ avatarMenu: false });
      this.showToast("Your profile photo has been updated");
    };
    r.readAsDataURL(f);
  };
  toggleAvatarMenu = () => this.setState((s) => ({ avatarMenu: !s.avatarMenu }));
  removeAvatar = () => {
    if (this.props.onAvatarChange) this.props.onAvatarChange(null);
    this.setState({ avatarMenu: false });
    this.showToast("Your profile photo has been removed");
  };

  showToast(text) {
    if (this._toastT) clearTimeout(this._toastT);
    this.setState({ toast: text });
    this._toastT = setTimeout(() => this.setState({ toast: null }), 3400);
  }

  blankAddr() { return { first: "", last: "", street: "", apt: "", city: "", state: "", zip: "", country: "United States" }; }

  applyNavKey(tab) {
    if (tab === "account") this.setState({ settingsTab: "account", edit: null, addrDraft: null });
    else if (tab === "organizations") this.setState({ settingsTab: "organizations", edit: null, addrDraft: null });
    else if (tab === "account-personal") { this.setState({ settingsTab: "account" }); this.startEdit("user")(); }
    else if (tab === "account-address") { this.setState({ settingsTab: "account" }); this.startAddrEdit(); }
  }
  startEdit = (kind) => () => {
    const st = { edit: { kind }, linkStub: false };
    if (kind === "email") st.emailDraft = { new: "", conf: "", pw: "" };
    if (kind === "password") { st.pwDraft = { cur: "", new: "", conf: "" }; st.showCur = false; st.showNew = false; st.showConf = false; st.signOut = true; }
    if (kind === "user") st.userDraft = { ...this.state.user, email: this.state.email };
    this.setState(st);
  };
  cancelEdit = () => this.setState({ edit: null, addrDraft: null });

  onEmail = (f) => (e) => { const v = e.target.value; this.setState((s) => ({ emailDraft: { ...s.emailDraft, [f]: v } })); };
  onPw = (f) => (e) => { const v = e.target.value; this.setState((s) => ({ pwDraft: { ...s.pwDraft, [f]: v } })); };
  onUser = (f) => (e) => { const v = e.target.value; this.setState((s) => ({ userDraft: { ...s.userDraft, [f]: v } })); };
  toggleShow = (f) => () => this.setState((s) => ({ [f]: !s[f] }));
  onSignOut = (e) => { const c = e.target.checked; this.setState({ signOut: c }); };

  saveEmail = () => { if (!this.emailV().enabled) return; const to = this.state.emailDraft.new.trim(); this.setState({ edit: null }); this.showToast("A verification link has been sent to " + to); };
  today() {
    const m = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const t = new Date();
    return t.getDate() + " " + m[t.getMonth()] + ", " + t.getFullYear();
  }
  savePw = () => { if (!this.pwV().enabled) return; this.setState({ edit: null, pwLastChanged: this.today() }); this.showToast(this.state.signOut ? "Your password has been updated and other devices signed out" : "Your password has been updated"); };
  saveUser = () => {
    this.setState((s) => {
      const nextEmail = (s.userDraft.email || s.email).trim();
      return { user: { ...s.userDraft }, email: nextEmail || s.email, edit: null };
    });
    this.showToast("Your details have been updated");
  };

  startAddrEdit = () => this.setState((s) => ({ edit: { kind: "addr" }, addrDraft: { ...(s.address || this.blankAddr()) }, linkStub: false }));
  cancelAddr = () => this.setState({ edit: null, addrDraft: null });
  onAddr = (f) => (e) => { const v = e.target.value; this.setState((s) => ({ addrDraft: { ...(s.addrDraft || this.blankAddr()), [f]: v } })); };
  addrValid() { const d = this.state.addrDraft; return !!(d && d.first && d.last && d.street && d.city && d.state && d.zip); }
  saveAddr = () => { if (!this.addrValid()) return; this.setState((s) => ({ address: { ...s.addrDraft, country: s.addrDraft.country || "United States" }, edit: null, addrDraft: null, addressVerify: s.addressVerify ? { ...s.addressVerify, status: "confirmed" } : s.addressVerify }), () => this.showToast("Your mailing address has been saved")); };
  confirmAddress = () => { this.setState((s) => ({ addressVerify: s.addressVerify ? { ...s.addressVerify, status: "confirmed" } : s.addressVerify })); this.showToast("Your mailing address has been confirmed"); };

  icon(name, size, sw) {
    const e = React.createElement;
    const svg = (...k) => e("svg", { viewBox: "0 0 24 24", width: size, height: size, fill: "none", stroke: "currentColor", strokeWidth: sw || 2, strokeLinecap: "round", strokeLinejoin: "round" }, ...k);
    const p = (d) => e("path", { d, key: d });
    switch (name) {
      case "eye": return svg(p("M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"), e("circle", { cx: 12, cy: 12, r: 3, key: "c" }));
      case "eyeoff": return svg(p("m2 2 20 20"), p("M6.7 6.7C3.9 8.3 2 12 2 12s3.5 7 10 7c2 0 3.7-.5 5.2-1.3"), p("M9.9 5.2C10.6 5.1 11.3 5 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.4 3.2"), p("M9.9 9.9a3 3 0 0 0 4.2 4.2"));
      case "check": return svg(p("M20 6 9 17l-5-5"));
      case "building": return svg(p("M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"), p("M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"), p("M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"), p("M10 6h4"), p("M10 10h4"), p("M10 14h4"));
      case "mail": return svg(e("rect", { width: 20, height: 16, x: 2, y: 4, rx: 2, key: "r" }), p("m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"));
      case "lock": return svg(e("rect", { width: 18, height: 11, x: 3, y: 11, rx: 2, ry: 2, key: "r" }), p("M7 11V7a5 5 0 0 1 10 0v4"));
      case "user": return svg(p("M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"), e("circle", { cx: 12, cy: 7, r: 4, key: "c" }));
      case "pin": return svg(p("M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"), e("circle", { cx: 12, cy: 10, r: 3, key: "c" }));
      default: return svg();
    }
  }

  emailV() {
    const d = this.state.emailDraft;
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const nv = (d.new || "").trim();
    const cv = (d.conf || "").trim();
    const nt = nv.length > 0;
    const formatBad = nt && !re.test(nv);
    const dom = nt && !formatBad ? nv.toLowerCase().split("@")[1] : "";
    const instBad = nt && !formatBad && this.INST_DOMAINS.some((x) => dom === x || dom.endsWith("." + x));
    const newErr = formatBad ? "Enter a valid email address" : (instBad ? "Enter a personal email, not your institution email" : null);
    const ct = cv.length > 0;
    const match = nv === cv;
    const confErr = ct && !match ? "Enter a matching email" : null;
    const confOk = ct && match && !newErr;
    const pw = (d.pw || "").length > 0;
    return { nv, newErr, confErr, confOk, enabled: nt && !newErr && ct && match && pw };
  }

  pwV() {
    const d = this.state.pwDraft;
    const np = d.new || "";
    const checks = [
      { label: "One lowercase character", met: /[a-z]/.test(np) },
      { label: "One uppercase character", met: /[A-Z]/.test(np) },
      { label: "One number", met: /[0-9]/.test(np) },
      { label: "One special character", met: /[^A-Za-z0-9]/.test(np) },
      { label: "12+ characters", met: np.length >= 12 },
      { label: "Different than previous 5 passwords", met: np.length > 0 && !this.PREVIOUS_PASSWORDS.includes(np) },
    ];
    const all = checks.every((c) => c.met);
    const cur = (d.cur || "").length > 0;
    const cv = d.conf || "";
    const match = np.length > 0 && np === cv;
    const confErr = cv.length > 0 && !match;
    return { checks, confErr, enabled: cur && all && match };
  }

  renderVals() {
    const lz = this.state.lzSeen || {};
    const d = this.state.isDesktop;
    const e = this.state.edit;
    const focusRing = { outline: "none", boxShadow: "var(--ring-focus)" };

    const inputStyle = { width: "100%", padding: "10px 12px", border: "1px solid var(--gray-300)", borderRadius: 8, font: "var(--fw-medium) var(--text-sm-size)/var(--text-sm-lh) var(--font-body)", color: "var(--gray-900)", background: "var(--surface)", outline: "none", boxShadow: "var(--shadow-xs)" };
    const inputErr = { ...inputStyle, borderColor: "var(--error-500)" };
    const pwInput = { ...inputStyle, paddingRight: 42 };
    const pwInputErr = { ...pwInput, borderColor: "var(--error-500)" };
    const inputFocus = { borderColor: "var(--blue-600)", boxShadow: "inset 0 0 0 2px var(--blue-600)" };
    const selectStyle = { ...inputStyle, appearance: "none", backgroundImage: "url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2220%22 height=%2220%22 fill=%22none%22 stroke=%22%23717680%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22m6 9 6 6 6-6%22/></svg>')", backgroundRepeat: "no-repeat", backgroundPosition: "right 10px center", paddingRight: 32, cursor: "pointer" };
