    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);

ttps://pricetn3.github.io/CC-Design-System/tokens.css\" data-cc-shared-tokens>\n<style>@import url(\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap\");\n\n/* ── colors_and_type.css ── */\n/* =====================================================================\n   Credential Connections — Design Tokens\n   ---------------------------------------------------------------------\n   Brand wordmark / logo navy:  rgb(41, 51, 74)   → --cc-navy\n   Brand primary action blue:   rgb(11, 108, 183) → --cc-primary-600\n   Sidebar tint (blue-25):      rgb(245, 251, 255)\n   Foundation:  Untitled UI (Inter + 25-step gray + colorful semantics)\n   ===================================================================== */\n\n/* ---------- Typeface ---------- */\n\n\n:root {\n\n  /* Display */\n  --text-display-2xl-size: 72px;  --text-display-2xl-lh: 90px;  --text-display-2xl-tracking: -0.02em;\n  --text-display-xl-size:  60px;  --text-display-xl-lh:  72px;  --text-display-xl-tracking:  -0.02em;\n  --text-display-lg-size:  48px;  --text-display-lg-lh:  60px;  --text-display-lg-tracking:  -0.02em;\n  --text-display-md-size:  36px;  --text-display-md-lh:  44px;  --text-display-md-tracking:  -0.02em;\n  --text-display-sm-size:  30px;  --text-display-sm-lh:  38px;\n  --text-display-xs-size:  24px;  --text-display-xs-lh:  32px;\n\n  /* Body */\n  --text-xl-size: 20px;  --text-xl-lh: 30px;\n  --text-lg-size: 18px;  --text-lg-lh: 28px;\n  --text-md-size: 16px;  --text-md-lh: 24px;\n  --text-smed-size: 15px; --text-smed-lh: 22px;\n  --text-sm-size: 14px;  --text-sm-lh: 20px;\n  --text-xs-size: 12px;  --text-xs-lh: 18px; /* @kind other */\n}\n\n/* =====================================================================\n   Semantic role aliases — components reach for these (h1, p, code…)\n   ===================================================================== */\n:where(body, html) {\n  font-family: var(--font-body);\n  color: var(--fg-primary);\n  backgr -fg-primary); }\n.cc-text-smed { font: var(--fw-regular) var(--text-smed-size)/var(--text-smed-lh) var(--font-body); color: var(--fg-primary); }\n.cc-text-sm { font: var(--fw-regular) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--fg-primary); }\n.cc-text-xs { font: var(--fw-regular) var(--text-xs-size)/var(--text-xs-lh) var(--font-body); color: var(--fg-primary); }\n\n.cc-label    { font: var(--fw-medium) 14px/20px var(--font-body); color: var(--gray-700); }\n.cc-eyebrow  { font: var(--fw-medium) 14px/20px var(--font-body); color: var(--gray-500); text-transform: none; }\n.cc-mono     { font: var(--fw-regular) 14px/20px var(--font-mono); color: var(--fg-primary); }\n.cc-code     { font: var(--fw-regular) 13px/20px var(--font-mono); background: var(--gray-100); padding: 2px 6px; border-radius: var(--radius-xs); color: var(--gray-800); }\n\n\n/* =====================================================================\n   Component recipes — from the coded source of truth\n   (The-Store/design-system/components.css). Tokens only.\n   Accessibility baseline: WCAG 2.2 AA — every control ≥ 24×24px,\n   focus ring 2px --blue-400 (3.82:1 on white).\n   ===================================================================== */\n\n/* Buttons */\n.cc-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  height: 40px;\n  padding: 0 var(--space-4);\n  border: none;\n  border-radius: var(--radius-md);\n  font: var(--fw-medium) var(--text-sm-size)/var(--text-sm-lh) var(--font-body);\n  cursor: pointer;\n  text-decoration: none;\n  white-space: nowrap;\n  transition: background 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;\n}\n.cc-btn:focus-visible { outline: none; box-shadow: var(--ring-focus); }\n/* xs: dense spots only (table rows, inline actions) */\n.cc-btn--xs { height: 32px; padding: 0 var(--space-3); gap: var(--space-1_5); }\n.cc-btn--sm { height: 36px; padding: 0 var(--space-3_5); }\n.cc-btn--lg {\n  height: 44px;\n  padding: 0 var(--space-5);\n  font-size: var(--text-md-size);\n  line-height: var(--text-md-lh);\n}\n.cc-btn--block { width: 100%; }\n.cc-btn--primary {\n  background: var(--blue-600);\n  color: var(--fg-on-brand);\n  box-shadow: var(--shadow-button-primary);\n}\n.cc-btn--primary:hover { background: var(--blue-700); }\n.cc-btn--secondary {\n  background: var(--bg-primary);\n  color: var(--gray-700);\n  box-shadow: var(--shadow-button-secondary), inset 0 0 0 1px var(--gray-300);\n}\n.cc-btn--secondary:hover { background: linear-gradient(var(--overlay-hover), var(--overlay-hover)), var(--bg-primary); color: var(--gray-800); }\n.cc-btn--tertiary { background: transparent; color: var(--gray-600); }\n.cc-btn--tertiary:hover { background: var(--overlay-hover); color: var(--gray-800); }\n/* Destructive: for delete, deactivate and remove actions. Filled for the final confirm in a dialog, outline for the action that opens it. */\n.cc-btn--destructive { background: var(--error-700); color: var(--fg-on-brand); box-shadow: var(--shadow-button-primary); }\n.cc-btn--destructive:hover { box-shadow: var(--shadow-button-primary), var(--shadow-md); }\n.cc-btn--destructive-secondary { background: var(--bg-primary); color: var(--error-700); box-shadow: var(--shadow-button-secondary), inset 0 0 0 1px var(--error-200); }\n.cc-btn--destructive-secondary:hover { background: var(--error-50); }\n.cc-btn--destructive > svg, .cc-btn--destructive > .lucide { color: var(--error-200); }\n/* Icons beside a label are one step lighter than the label, matching the CC Platform.\n   They're decorative (the label carries the meaning), so 1.4.11 contrast doesn't apply. Icon-only buttons use .cc-icon-btn. */\n.cc-btn > svg, .cc-btn > .lucide { flex-shrink: 0; transition: color 150ms cubic-bezier(0.2,0.6,0.2,1); }\n.cc-btn--primary > svg, .cc-btn--primary > .lucide { color: var(--blue-200); }\n.cc-btn--primary:hover > svg, .cc-btn--primary:hover > .lucide { color: var(--blue-300); }\n.cc-btn--secondary > svg, .cc-btn--secondary > .lucide,\n.cc-btn--tertiary > svg, .cc-btn--tertiary > .lucide { color: var(--gray-400); }\n.cc-btn--secondary:hover > svg, .cc-btn--secondary:hover > .lucide,\n.cc-btn--tertiary:hover > svg, .cc-btn--tertiary:hover > .lucide { color: var(--gray-500); }\n.cc-btn:disabled,\n.cc-btn[aria-disabled=\"true\"] {\n  background: var(--gray-100);\n  color: var(--gray-400);\n  box-shadow: none;\n  cursor: not-allowed;\n  pointer-events: none;\n}\n.cc-btn:disabled > svg, .cc-btn:disabled > .lucide,\n.cc-btn[aria-disabled=\"true\"] > svg, .cc-btn[aria-disabled=\"true\"] > .lucide { color: currentColor; }\n/* A button turned off with aria-disabled can still take keyboard focus, so it keeps the focus ring (WCAG 2.4.7). */\n.cc-btn[aria-disabled=\"true\"]:focus-visible { box-shadow: var(--ring-focus); }\n\n/* Icon buttons */\n.cc-icon-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 36px;\n  height: 36px;\n  border: none;\n  border-radius: var(--radius-md);\n  background: transparent;\n  color: var(--gray-500);\n  cursor: pointer;\n}\n.cc-icon-btn:hover { background: var(--overlay-hover, rgba(10, 13, 18, 0.05)); color: var(--gray-900); }\n/* Flat (tertiary) icon button: no border. Hover is a see-through tint plus a darker icon, so it stays visible on any row or surface color (white, gray-50 hover rows, tinted rows). */\n.cc-icon-btn:active { background: var(--overlay-subtle, rgba(10, 13, 18, 0.12)); }\n/* xs: 32px, dense spots only (table rows, inline actions) */\n.cc-icon-btn--xs { width: 32px; height: 32px; }\n/* lg: 44px target for header and touch-first icon buttons (FX-20). Same icon size; only the button grows. */\n.cc-icon-btn--lg { width: 44px; height: 44px; }\n.cc-icon-btn:focus-visible { outline: none; box-shadow: var(--ring-focus); }\n\n/* Link row: a whole list row that opens something, such as a settings summary item. 26px tall (WCAG 2.5.8 needs 24px), flat with a tint on hov "none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fsc-if><\u002Fdd>\n                  <\u002Fsc-for>\n                <\u002Fdl>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin: 0 24px 20px; font: var(--fw-regular) 12px/18px var(--font-body); color: var(--gray-600);\">{{ ppHiddenText }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fsection>\n        <section class=\"adm-card\" aria-labelledby=\"po-items\">\n          <h3 id=\"po-items\" class=\"adm-section-title\" style=\"padding: 20px 24px 0;\">Credentials in this order<\u002Fh3>\n          <div style=\"overflow-x: auto;\">\n            <sc-raw-table class=\"adm-table\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"padding: 10px 12px 10px 20px;\">Credential<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 10px 12px;\">Type<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 10px 12px;\">Replacement<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 10px 12px; text-align: right;\">Quantity<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding: 10px 20px 10px 12px; text-align: right;\">Price<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ po.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                  <sc-raw-tr>\n                    <sc-raw-td class=\"adm-wrap-cell\" style=\"color: var(--gray-900); font-weight: var(--fw-medium); max-width: 420px;\"><sc-if value=\"{{ it.notCur }}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" class=\"cc-link adm-items__link\" sc-camel-on-click=\"{{ it.openRec }}\" aria-label=\"View record: {{ it.name }}, {{ it.type }}\">{{ it.name }}<\u002Fbutton><\u            <\u002Fsc-if>\n            <sc-if value=\"{{ po.noShipping }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin: 0; font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-600);\">Nothing to ship. This order has digital credentials only.<\u002Fp><\u002Fsc-if>\n          <\u002Fsection>\n          <section class=\"adm-card\" aria-labelledby=\"po-contact\" style=\"padding: 20px 24px;\">\n            <h3 id=\"po-contact\" class=\"adm-section-title\">Contact<\u002Fh3>\n            <dl class=\"adm-dl\">\n              <dt>Contact email<\u002Fdt><dd><a class=\"cc-link adm-mail\" href=\"mailto:{{ po.contactEmail }}\">{{ po.contactEmail }}<\u002Fa><button type=\"button\" class=\"adm-copy\" aria-label=\"Copy contact email {{ po.contactEmail }}\" sc-camel-on-click=\"{{ copyContact }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdd>\n              <dt>Contact phone<\u002Fdt><dd><a class=\"cc-link adm-mail\" href=\"{{ po.contactTel }}\">{{ po.contactPhone }}<\u002Fa><\u002Fdd>\n            <\u002Fdl>\n          <\u002Fsection>\n        <\u002Fdiv>\n\n        <section class=\"adm-card\" aria-labelledby=\"po-history\">\n          <div style=\"padding: 20px 24px 0;\">\n            <h3 id=\"po-history\" class=\"adm-section-title\" style=\"margin-bottom: 4px;\">System records<\u002Fh3>\n            <p style=\"margin: 0 0 12px; font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-600);\">The store database records behind this order, for troubleshooting.<\u002Fp>\n            <div class=\"cc-utabs adm-linetabs\" role=\"tablist\" aria-label=\"Transaction history\" style=\"max-width: 100%;\">\n              <sc-for list=\"{{ histTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <button type=\"button\" role=\"tab\" class=\"cc-utabs__tab\" id=\"{{ t.tabId }}\" aria-selected=\"{{ t.selected }}\" aria-controls=\"po-hist-panel\" tabindex=\"{{ t.tabindex }}\" sc-camel-on-click=\"{{ t.pick }}\" sc-camel-on-key-down=\"{{ histTabKey }}\">{{ t.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div id=\"po-hist-panel\" role=\"tabpanel\" aria-labelledby=\"{{ histPanelLabel }}\" tabindex=\"0\" style=\"overflow-x: auto;\">\n            <sc-raw-table class=\"adm-table\">\n              <sc-raw-caption class=\"sr-only\">{{ histCaption }}<\u002Fsc-raw-caption>\n              <sc-raw-thead><sc-raw-tr>\n                <sc-for list=\"{{ hist.cols }}\" as=\"hc\" hint-placeholder-count=\"7\"><sc-raw-th scope=\"col\" style=\"padding: 10px 12px;\">{{ hc.label }}<\u002Fsc-raw-th><\u002Fsc-for>\n              <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ hist.rows }}\" as=\"hr\" hint-placeholder-count=\"3\">\n                  <sc-raw-tr>\n                    <sc-for list=\"{{ hr.cells }}\" as=\"hcell\" hint-placeholder-count=\"7\"><sc-raw-td class=\"adm-nowrap {{ hcell.cls }}\">{{ hcell.v }}<\u002Fsc-raw-td><\u002Fsc-for>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <!-- Validations -->\n        <sc-if value=\"{{ valTab }}\" hint-placeholder-val=\"{{ false }}\">\n          <section class=\"adm-card\" aria-labelledby=\"rp-val\">\n            <div style=\"padding: 20px 24px 16px;\">\n              <h2 id=\"rp-val\" class=\"adm-section-title\" style=\"margin-bottom: 4px;\">Validation details<\u002Fh2>\n              <p style=\"margin: 0; font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-600); overflow-wrap: anywhere;\">CeDiD <span class=\"adm-mono\">{{ rec.cedid }}<\u002Fspan>. Includes validations on the Paradigm page and on institution validation pages, newest first.<\u002Fp>\n            <\u002Fdiv>\n        <sc-if value=\"{{ valError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div role=\"alert\" style=\"margin: 0 24px 24px; display: flex; gap: 12px; align-items: flex-start; padding: 16px; border: 1px solid var(--error-200); border-radius: var(--radius-xl); background: var(--error-50);\">\n            <svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; color: var(--error-700);\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 8v4M12 16h.01\"><\u002Fpath><\u002Fsvg>\n            <div>\n              <p style=\"margin: 0; font: var(--fw-semibold) 14px/20px var(--font-body); color: var(--gray-900);\">We couldn't load the validation details<\u002Fp>\n              <p style=\"margin: 2px 0 0; font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-700);\">Something went wrong on our side. Try again.<\u002Fp>\n              <button type=\"button\" class=\"cc-btn cc-btn--secondary cc-btn--sm\" sc-camel-on-click=\"{{ retryValidations }}\" style=\"margin-top: 12px;\">Try again<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ valLoading }}\" hint-placeholder-val=\"{{ false }}\">\n          <div aria-busy=\"true\" style=\"margin: 0 24px 24px; display: flex; flex-direction: column; gap: 14px;\"><span class=\"sr-only\">Loading validation details<\u002Fspan><span class=\"adm-skel\" style=\"width: 100%;\"><\u002Fspan><span class=\"adm-skel\" style=\"width: 92%;\"><\u002Fspan><span class=\"adm-skel\" style=\"width: 96%;\"><\u002Fspan><span class=\"adm-skel\" style=\"width: 88%;\"><\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ valEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin: 0 24px 24px; font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-600);\">This credential hasn't been validated yet.<\u002Fp>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ valRowsShow }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"overflow: auto; border-top: 1px solid var(--gray-200);\" tabindex=\"0\" role=\"region\" aria-label=\"Validations, {{ valCount }}\">\n            <sc-raw-table class=\"adm-table\">\n              <sc-raw-caption class=\"sr-only\">{{ valCount }}, newest first<\u002Fsc-raw-caption>\n              <sc-raw-thead><sc-raw-tr>\n                <sc-raw-th scope=\"col\" style=\"padding: 10px 12px 10px 24px;\">Date validated<\u002Fsc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"padding: 10px 12px;\">Is valid<\u002Fsc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"padding: 10px 12px;\">IP address<\u002Fsc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"padding: 10px 12px;\">IID<\u002Fsc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"padding: 10px 12px;\">Organization ID<\u002Fsc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"padding: 10px 24px 10px 12px;\">Diploma ID (CeDiD)<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ valRows }}\" as=\"vr\" hint-placeholder-count=\"4\">\n                  <sc-raw-tr>\n                    <sc-raw-td class=\"adm-nowrap\" style=\"padding-left: 24px;\">{{ vr.date }}<\u002Fsc-raw-td>\n                    <sc-raw-td class=\"adm-nowrap\"><span class=\"{{ vr.cls }}\"><span class=\"cc-badge__dot\" aria-hidden=\"true\"><\u002Fspan>{{ vr.valid }}<\u002Fspan><\u002Fsc-raw-td>\n                    <sc-raw-td class=\"adm-nowrap adm-mono\">{{ vr.ip }}<\ l=\"Records\" class=\"adm-stepnav\">\n              <button type=\"button\" class=\"adm-stepbtn\" aria-label=\"Previous record\" sc-camel-on-click=\"{{ recPrev }}\" aria-disabled=\"{{ recPrevDis }}\" style=\"{{ recPrevStyle }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <span class=\"adm-steppos\">{{ recNavText }}<\u002Fspan>\n              <button type=\"button\" class=\"adm-stepbtn\" aria-label=\"Next record\" sc-camel-on-click=\"{{ recNext }}\" aria-disabled=\"{{ recNextDis }}\" style=\"{{ recNextStyle }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fnav><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div class=\"adm-dh__top\">\n            <div style=\"flex: 1; min-width: 0;\">\n              <div class=\"adm-dh__namerow\"><h2 id=\"adm-rec-title\" class=\"adm-dh__title\" tabindex=\"-1\" ref=\"{{ recTitleRef }}\" aria-level=\"{{ recTitleLevel }}\" style=\"outline: none;\">{{ rec.name }}<\u002Fh2><span class=\"adm-storewrap\" sc-camel-on-mouse-leave=\"{{ panelTipReset }}\"><a class=\"adm-storelink adm-storelink--on\" href=\"{{ rec.viewAsUrl }}\" target=\"_blank\" rel=\"noopener\" aria-label=\"View store for {{ rec.name }}, read-only, opens in a new tab\" aria-describedby=\"adm-tip-panel\" sc-camel-on-click=\"{{ openViewAs }}\" sc-camel-on-key-down=\"{{ panelTipKey }}\" sc-camel-on-blur=\"{{ panelTipReset }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ari =\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ recIsPage }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"adm-pgactions\"><sc-if value=\"{{ rec.isDigital }}\" hint-placeholder-val=\"{{ true }}\"><a class=\"cc-btn cc-btn--primary\" href=\"{{ rec.validateUrl }}\" target=\"_blank\" rel=\"noopener\">Validate credential<span class=\"sr-only\"> (opens the CeCredential Trust validation page in a new tab)<\u002Fspan><\u002Fa><\u002Fsc-if><\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ onDrawer }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"cc-tabs cc-tabs--brand adm-dtabs\" role=\"tablist\" aria-label=\"Record details\">\n            <sc-for list=\"{{ drawerTabs }}\" as=\"dt\" hint-placeholder-count=\"3\">\n              <button type=\"button\" role=\"tab\" class=\"cc-tabs__tab\" id=\"{{ dt.tabId }}\" aria-selected=\"{{ dt.selected }}\" aria-controls=\"adm-rec-panel\" tabindex=\"{{ dt.tabindex }}\" sc-camel-on-click=\"{{ dt.pick }}\" sc-camel-on-key-down=\"{{ drawerTabKey }}\">{{ dt.label }}<sc-if value=\"{{ dt.hasCount }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"cc-tabs__count\">{{ dt.countText }}<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fheader>\n\n        <div class=\"adm-recbody\">\n        <!-- Both views use the same horizontal tabs (panel and full page) -->\n        <div class=\"{{ dbodyCls }}\" id=\"adm-dbody\" role=\"{{ dbodyRole }}\" aria-labelledby=\"{{ drawerPanelLabel }}\" aria-busy=\"{{ detailsBusyAria }}\">\n          <sc-if value=\"{{ detailsLoading }}\" hint-placeholder-val=\"{{ false }}\"><div aria-busy=\"true\" style=\"display: flex; flex-direction: column; gap: 14px;\"><span class=\"sr-only\">Loading record details<\u002Fspan><span class=\"adm-skel\" style=\"width: 40%; height: 16px;\"><\u002Fspan><span class=\"adm-skel\" style=\"width: 92%;\"><\u002Fspan><span class=\"adm-skel\" style=\"width: 80%;\"><\u002Fspan><span class=\"adm-skel\" style=\"width: 86%;\"><\u002Fspan><span class=\"adm-skel\" style=\"width: 60%;\"><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n\n          <!-- Details: the 12425 record fields (same as the table row, so it is clear which record this is), then 12430 digital or 12431 paper details. Order details live in Purchase details. -->\n          <sc-if value=\"{{ detailsReady }}\" hint-placeholder-val=\"{{ true }}\">\n            <!-- Details: the record (12425) with its Digital details (12430) or Paper details (12431: PDiplomaID, Replacement). The reference number is in the header; the order, its shipping (12431 + 12438) and cost are the Order tab. -->\n            <sc-if value=\"{{ recIsPanel }}\" hint-placeholder-val=\"{{ true }}\">\n            <section class=\"adm-dcard\" aria-labelledby=\"dr-stu\">\n              <div class=\"adm-dcard__head\"><h3 id=\"dr-stu\" class=\"adm-dcard__title\">Student<\u002Fh3><sc-if value=\"{{ rec.stuMulti }}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" class=\"cc-link cc-link-btn adm-golink\" sc-camel-on-click=\"{{ rec.showStudent }}\" aria-label=\"{{ rec.stuAllLabel }}\">View all {{ rec.stuCount }} records<svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M12 5l7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n              <dl class=\"adm-dl\">\n                <dt>Student name<\u002Fdt><dd>{{ rec.name }}<\u002Fdd>\n                <dt>Student ID<\u002Fdt><dd><span class=\"adm-mono\">{{ rec.sid }}<\u002Fspan><button type=\"button\" class=\"adm-copy\" aria-label=\"Copy student ID {{ rec.sid }}\" sc-camel-on-click=\"{{ copySid }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdd>\n                <dt>School email<\u002Fdt><dd><a class=\"cc-link adm-mail\" href=\"mailto:{{ rec.semail }}\">{{ rec.semailWrap }}<\u002Fa><button type=\"button\" class=\"adm-copy\" aria-label=\"Copy school email {{ rec.semail }}\" sc-camel-on-click=\"{{ copySemail }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdd>\n                <dt>Personal email<\u002Fdt><dd><sc-if value=\"{{ rec.hasPemail }}\" hint-placeholder-val=\"{{ true }}\"><a class=\"cc-link adm-mail\" href=\"mailto:{{ rec.pemail }}\">{{ rec.pemailWrap }}<\u002Fa><button type=\"button\" class=\"adm-copy\" aria-label=\"Copy personal email {{ rec.pemail }}\" sc-camel-on-click=\"{{ copyPemail }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ rec.noPemail }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"adm-muted\"><span aria-hidden=\"true\">—<\u002Fspan><span class=\"sr-only\">None<\u002Fspan><\u002Fspan><\u002Fsc-if><\u002Fdd>\n              <\u002Fdl>\n              <a class=\"cc-btn cc-btn--secondary adm-stubtn\" href=\"{{ rec.viewAsUrl }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ openViewAs }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 3h6v6\"><\u002Fpath><path d=\"M10 14 21 3\"><\u002Fpath><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"><\u002Fpath><\u002Fsvg>View student's store<span class=\"sr-only\">, {{ rec.name }}, read-only (opens in a new tab)<\u002Fspan><\u002Fa>\n            <\u002Fsection>\n            <\u002Fsc-if>\n            <section class=\"adm-dcard\" aria-labelledby=\"dr-cred\">\n              <h3 id=\"dr-cred\" class=\"adm-dcard__title\" style=\"margin-bottom: 12px;\">Credential<\u002Fh3>\n              <dl class=\"adm-dl\">\n                <dt>Credential<\u002Fdt><dd>{{ rec.cred }}<\u002Fdd>\n                <dt>Major<\u002Fdt><dd><sc-if value=\"{{ rec.hasMajor }}\" hint-placeholder-val=\"{{ true }}\">{{ rec.major }}<\u002Fsc-if><sc-if value=\"{{ rec.noMajor }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"adm-muted\"><span aria-hidden=\"true\">—<\u002Fspan><span class=\"sr-only\">None<\u002Fspan><\u002Fspan><\u002Fsc-if><\u002Fdd>\n                <dt>Organization<\u002Fdt><dd>{{ rec.org }}<\u002Fdd>\n                <dt>School name<\u002Fdt><dd>{{ rec.school }}<\u002Fdd>\n                <dt>Conferral date<\u002Fdt><dd>{{ rec.conf }}<\u002Fdd>\n                <sc-if value=\"{{ rec.isDigital }}\" hint-placeholder-val=\"{{ true }}\"><dt>{{ rec.shipLabel2 }}<\u002Fdt><dd><sc-if value=\"{{ rec.shipNoBadge }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"{{ rec.shipClass }}\">{{ rec.ship }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ rec.shipBadge }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"cc-badge cc-badge--square cc-badge--warning\">Not shipped<\u002Fspan><\u002Fsc-if><\u002Fdd><\u002Fsc-if>\n                <dt>In-house<\u002Fdt><dd>{{ rec.inhouse }}<\u002Fdd>\n              <\u002Fdl>\n            <\u002Fsection>\n            <sc-if value=\"{{ rec.isDigital }}\" hint-placeholder-val=\"{{ true }}\">\n            <section class=\"adm-dcard\" aria-labelledby=\"dr-dig\">\n              <h3 id=\"dr-dig\" class=\"adm-dcard__title\" style=\"margin-bottom: 12px;\">{{ digTitle }}<\u002Fh3>\n              <dl class=\"adm-dl\">\n                <dt>CeDiD<\u002Fdt><dd><span class=\"adm-mono\">{{ rec.cedid }}<\u002Fspan><button type=\"button\" class=\"adm-copy\" aria-label=\"Copy CeDiD {{ rec.cedid }}\" sc-camel-on-click=\"{{ copyCedid }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdd>\n                <dt>Download date<\u002Fdt><dd><span class=\"{{ rec.dlClass }}\">{{ rec.download }}<\u002Fspan><\u002Fdd>\n                <dt>Purchased<\u002Fdt><dd class=\"adm-badgerow\"><span class=\"{{ rec.purchBadge.cls }}\"><span class=\"cc-badge__dot\" aria-hidden=\"true\"><\u002Fspan>{{ rec.purchBadge.label }}<\u002Fspan><span class=\"adm-muted\">{{ rec.modelOnly }}<\u002Fspan><\u002Fdd>\n                <dt>Validation details<\u002Fdt><dd class=\"adm-badgerow\"><sc-if value=\"{{ rec.isRevoked }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"cc-badge cc-badge--square cc-badge--error\"><span class=\"cc-badge__dot\" aria-hidden=\"true\"><\u002Fspan>Not valid<\u002Fspan><\u002Fsc-if><span>{{ rec.valSummary }}<sc-if value=\"{{ rec.hasVals }}\" hint-placeholder-val=\"{{ true }}\"> · <button type=\"button\" class=\"cc-link cc-link-btn\" sc-camel-on-click=\"{{ openValidations }}\" style=\"font-weight: var(--fw-medium);\">View all validations<\u002Fbutton><\u002Fsc-if><\u002Fspan><\u002Fdd>\n              <\u002Fdl>\n            <\u002Fsection>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ rec.isPaper }}\" hint-placeholder-val=\"{{ false }}\">\n            <section class=\"adm-dcard\" aria-labelledby=\"dr-pap\">\n              <h3 id=\"dr-pap\" class=\"adm-dcard__title\" style=\"margin-bottom: 12px;\">Paper details<\u002Fh3>\n              <dl class=\"adm-dl\">\n                <dt>PDiplomaID<\u002Fdt><dd><span class=\"adm-mono\">{{ rec.pdid }}<\u002Fspan><button type=\"button\" class=\"adm-copy\" aria-label=\"Copy PDiplomaID {{ rec.pdid }}\" sc-camel-on-click=\"{{ copyPdid }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdd>\n                <dt>Replacement<\u002Fdt><dd><sc-if value=\"{{ rec.isRepl }}\" hint-placeholder-val=\"{{ false }}\"><span>{{ rec.repl }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ rec.notRepl }}\" hint-placeholder-val=\"{{ true }}\">No<\u002Fsc-if><\u002Fdd>\n              <\u002Fdl>\n              <sc-if value=\"{{ rec.paperOff }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin: 12px 0 0; font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-600);\">{{ rec.orgShort }} has turned paper ordering off. Earlier paper records still show here.<\u002Fp><\u002Fsc-if>\n            <\u002Fsection>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n\n          <!-- Order tab (12438): order (with checkout contact), credentials + cost, shipping. Transaction history is in Student activity. -->\n          <sc-if value=\"{{ orderTab }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-if value=\"{{ rec.noRef }}\" hint-placeholder-val=\"{{ false }}\">\n              <section class=\"adm-dcard\"><h3 class=\"adm-dcard__title\">No order<\u002Fh3><p style=\"margin: 4px 0 0; font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-600);\">{{ rec.noOrderReason }}<\u002Fp><\u002Fsection>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ rec.hasRef }}\" hint-placeholder-val=\"{{ true }}\">\n              <sc-if value=\"{{ purchaseError }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"alert\" style=\"display: flex; gap: 12px; align-items: flex-start; padding: 16px; border: 1px solid var(--error-200); border-radius: var(--radius-xl); background: var(--error-50);\">\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; color: var(--error-700);\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 8v4M12 16h.01\"><\u002Fpath><\u002Fsvg>\n              <div><p style=\"margin: 0; font: var(--fw-semibold) 14px/20px var(--font-body); color: var(--gray-900);\">We couldn't load the purchase details<\u002Fp><p style=\"margin: 2px 0 0; font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-700);\">Something went wrong on our side. Try again.<\u002Fp><button type=\"button\" class=\"cc-btn cc-btn--secondary cc-btn--sm\" sc-camel-on-click=\"{{ retryPurchase }}\" style=\"margin-top: 12px;\">Try again<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ purchaseSkeleton }}\" hint-placeholder-val=\"{{ false }}\"><div aria-busy=\"true\" style=\"display: flex; flex-direction: column; gap: 14px;\"><span class=\"sr-only\">Loading purchase details<\u002Fspan><span class=\"adm-skel\" style=\"width: 40%; height: 16px;\"><\u002Fspan><span class=\"adm-skel\" style=\"width: 92%;\"><\u002Fspan><span class=\"adm-skel\" style=\"width: 80%;\"><\u002Fspan><span class=\"adm-skel\" style=\"width: 86%;\"><\u002Fspan><span class=\"adm-skel\" style=\"width: 60%;\"><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ purchaseLoaded }}\" hint-placeholder-val=\"{{ true }}\">\n                <sc-if value=\"{{ rec.orderFailed }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding: 12px 16px; border: 1px solid var(--error-200); border-radius: var(--radius-lg); background: var(--error-50); font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-600); color: var(--gray-900);\"><strong style=\"font-weight: var(--fw-semibold);\">Payment failed.<\u002Fstrong> The student wasn't charged and nothing was released or shipped. The failed attempt is in Student activity.<\u002Fdiv>\n                <\u002Fsc-if>\n                <section class=\"adm-dcard\" aria-labelledby=\"dr-po-order\">\n              <h3 id=\"dr-po-order\" class=\"adm-dcard__title\" style=\"margin-bottom: 12px;\">Order<\u002Fh3>\n              <dl class=\"adm-dl\">\n                  <dt>Reference number<\u002Fdt><dd><span class=\"adm-mono\">{{ po.ref }}<\u002Fspan><button type=\"button\" class=\"adm-copy\" aria-label=\"Copy reference number {{ po.ref }}\" sc-camel-on-click=\"{{ copyRef }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdd>\n                  <dt>Submitted<\u002Fdt><dd>{{ po.submitted }}<\u002Fdd>\n                  <dt>Confirmation email sent<\u002Fdt><dd>{{ po.confirmEmail }}<\u002Fdd>\n                  <dt>Replacement in order<\u002Fdt><dd>{{ rec.orderHasRepl }}<\u002Fdd>\n                  <dt>Contact email<\u002Fdt><dd><a class=\"cc-link adm-mail\" href=\"mailto:{{ po.contactEmail }}\">{{ po.contactEmail }}<\u002Fa><button type=\"button\" class=\"adm-copy\" aria-label=\"Copy contact email {{ po.contactEmail }}\" sc-camel-on-click=\"{{ copyContact }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdd>\n                  <dt>Contact phone<\u002Fdt><dd><a class=\"cc-link adm-mail\" href=\"{{ po.contactTel }}\">{{ po.contactPhone }}<\u002Fa><\u002Fdd>\n                <\u002Fdl>\n            <\u002Fsection>\n                <!-- Shipping (12438 + 12431): everything paper in the order ships together, so it lives with the order (12431 AC 3) -->\n                <sc-if value=\"{{ po.hasShipping }}\" hint-placeholder-val=\"{{ true }}\">\n                <section class=\"adm-dcard\" aria-labelledby=\"dr-ship\">\n              <h3 id=\"dr-ship\" class=\"adm-dcard__title\" style=\"margin-bottom: 12px;\">Shipping<\u002Fh3>\n              <dl class=\"adm-dl\">\n                  <dt>Shipment date<\u002Fdt><dd class=\"adm-badgerow\"><sc-if value=\"{{ po.isShipped }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"cc-badge cc-badge--square cc-badge--success\"><span class=\"cc-badge__dot\" aria-hidden=\"true\"><\u002Fspan>Shipped<\u002Fspan><span>{{ po.shippedOn }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ po.notShipped }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"cc-badge cc-badge--square cc-badge--warning\"><span class=\"cc-badge__dot\" aria-hidden=\"true\"><\u002Fspan>Not shipped<\u002Fspan><\u002Fsc-if><\u002Fdd>\n                  <dt>Service type<\u002Fdt><dd>{{ po.serviceType }}<\u002Fdd>\n                  <dt>Shipping service<\u002Fdt><dd>{{ po.shipService }}<\u002Fdd>\n                  <d    <label class=\"rail-label\" for=\"rail-record\">Open a record<\u002Flabel>\n            <sc-raw-select id=\"rail-record\" class=\"rail-select\" value=\"{{ railRecordVal }}\" sc-camel-on-change=\"{{ railRecord }}\">\n              <option value=\"none\">None<\u002Foption>\n              <option value=\"digital\">Digital, purchased<\u002Foption>\n              <option value=\"digital-unpaid\">Digital, payment failed<\u002Foption>\n              <option value=\"digital-prepaid\">Digital, prepaid (Buy all)<\u002Foption>\n              <option value=\"revoked\">Digital, not valid (revoked)<\u002Foption>\n              <option value=\"paper\">Paper, not shipped<\u002Foption>\n              <option value=\"paper-shipped\">Paper, shipped<\u002Foption>\n              <option value=\"replacement\">Paper replacement<\u002Foption>\n              <option value=\"paper-off\">Paper, org turned paper off<\u002Foption>\n              <option value=\"long\">Long names<\u002Foption>\n              <option value=\"other\" disabled>Another record<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <sc-if value=\"{{ rec.isDigital }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-if value=\"{{ drawerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n                <label class=\"rail-label\" for=\"rail-val\">Validation details<\u002Flabel>\n                <sc-raw-select id=\"rail-val\" class=\"rail-select\" value=\"{{ railValVal }}\" sc-camel-on-change=\"{{ railVal }}\">\n                  <option value=\"closed\">Closed<\u002Foption>\n                  <option value=\"open\">Open<\u002Foption>\n                  <option value=\"error\">Error<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ onPurchase }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n            <label class=\"rail-label\" for=\"rail-order\">Order<\u002Flabel>\n            <sc-raw-select id=\"rail-order\" class=\"rail-select\" value=\"{{ railOrderVal }}\" sc-camel-on-change=\"{{ railOrder }}\">\n              <option value=\"mixed\">Digital, paper and replacement<\u002Foption>\n              <option value=\"digital\">Digital only<\u002Foption>\n              <option value=\"paper\">Paper only<\u002Foption>\n              <option value=\"failed\">Payment failed<\u002Foption>\n              <option value=\"other\" disabled>Another order<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px;\">\n            <span id=\"rail-perr\" class=\"rail-label\">Load error<\u002Fspan>\n            <button type=\"button\" role=\"switch\" aria-checked=\"{{ purchaseErrorAria }}\" aria-labelledby=\"rail-perr\" class=\"cc-switch\" sc-camel-on-click=\"{{ togglePurchaseError }}\"><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ railDetailsShow }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px;\">\n          <span class=\"rail-label\">Record view<\u002Fspan>\n          <div role=\"group\" aria-label=\"Record view\" style=\"display: flex; gap: 2px; background: rgba(120,120,128,0.14); border-radius: 9px; padding: 2px;\">\n            <button type=\"button\" class=\"rail-seg\" aria-pressed=\"{{ viewPanelPressed }}\" sc-camel-on-click=\"{{ setViewPanel }}\">Panel<\u002Fbutton>\n            <button type=\"button\" class=\"rail-seg\" aria-pressed=\"{{ viewPagePressed }}\" sc-camel-on-click=\"{{ setViewPage }}\">Full page<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px;\">\n          <span id=\"rail-dload\" class=\"rail-label\">Details loading<\u002Fspan>\n          <button type=\"button\" role=\"switch\" aria-checked=\"{{ detailsLoadingAria }}\" aria-labelledby=\"rail-dload\" class=\"cc-switch\" sc-camel-on-click=\"{{ toggleDetailsLoading }}\"><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div aria-hidden=\"true\" style=\"height: 1px; background: rgba(10,13,18,0.1); margin: 2px 0;\"><\u002Fdiv>\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px;\">\n        <span class=\"rail-label\">Device<\u002Fspan>\n        <div role=\"group\" aria-label=\"Device\" style=\"display: flex; gap: 2px; background: rgba(120,120,128,0.14); border-radius: 9px; padding: 2px;\">\n          <button type=\"button\" class=\"rail-seg\" aria-pressed=\"{{ deskPressed }}\" aria-label=\"Desktop preview\" title=\"Desktop preview\" sc-camel-on-click=\"{{ setDesktop }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M8 21h8M12 17v4\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <button type=\"button\" class=\"rail-seg\" aria-pressed=\"{{ mobPressed }}\" aria-label=\"Mobile preview\" title=\"Mobile preview\" sc-camel-on-click=\"{{ setMobile }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"><\u002Frect><path d=\"M12 18h.01\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div aria-hidden=\"true\" style=\"height: 1px; background: rgba(10,13,18,0.1); margin: 2px 0;\"><\u002Fdiv>\n      <div style=\"display: flex; gap: 6px; align-items: flex-start;\">\n        <div style=\"flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px;\">\n          <button type=\"button\" class=\"rail-btn\" sc-camel-on-click=\"{{ copyLink }}\" title=\"Copy a link to this exact screen\" style=\"width: 100%;\">\n            <svg sc-camel-view-box=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"><\u002Fpath><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"><\u002Fpath><\u002Fsvg>\n            <span>{{ copyLabel }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ linkCopyFailed }}\" hint-placeholder-val=\"{{ false }}\">\n            <input type=\"text\" readonly value=\"{{ linkUrl }}\" aria-label=\"Link to this screen\" style=\"width: 100%; height: 26px; border: 1px solid var(--gray-300); border-radius: 6px; padding: 0 6px; font: 500 10px/14px var(--font-body); color: var(--gray-700); background: #fff;\">\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <button type=\"button\" class=\"rail-btn\" sc-camel-on-click=\"{{ resetRail }}\" title=\"Back to the start screen, desktop\">Reset<\u002Fbutton>\n      <\u002Fdiv>\n      <span style=\"font: 400 10px/14px var(--font-body); color: var(--gray-600); text-align: center;\">Shift+H hides this panel<\u002Fspan>\n    <\u002Faside>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ railClosed }}\" hint-placeholder-val=\"{{ false }}\">\n    <button type=\"button\" sc-camel-on-click=\"{{ openRail }}\" aria-label=\"Open prototype controls\" title=\"Show controls (Shift+H)\" class=\"rail-seg\" style=\"position: fixed; top: 50%; right: 0; transform: translateY(-50%); z-index: 100; width: 28px; height: 44px; background: rgba(255,255,255,0.9); border-radius: 14px 0 0 14px; box-shadow: 0 8px 32px rgba(10,13,18,0.12), 0 1px 3px rgba(10,13,18,0.06);\">\n      <svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 18L9 12L15 6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n  <\u002Fsc-if>\n<\u002Fsc-if>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":900}}'>\nclass Component extends DCLogic {\n  /* ---------- Sample data (all fictional) ---------- */\n  static ORGS_BASE = [\n    { id: \"1001\", short: \"VHU\", name: \"Virginia Hanock University\", domain: \"vhu.edu\", model: \"Student Purchase\", paperOn: true },\n    { id: \"1014\", short: \"NIT\", name: \"Northfield Institute of Technology\", domain: \"nit.edu\", model: \"Buy All\", paperOn: true },\n    { id: \"1022\", short: \"CRU\", name: \"Cedar Ridge University\", domain: \"cru.edu\", model: \"Pay As You Go\", paperOn: true },\n    { id: \"1037\", short: \"LCC\", name: \"Lakeshore Community College\", domain: \"lcc.edu\", model: \"Student Purchase\", paperOn: false },\n    { id: \"1045\", short: \"BSN\", name: \"Bayview School of Nursing and Allied Health Sciences\", domain: \"bsn.edu\", model: \"Buy All\", paperOn: true },\n    { id: \"1058\", short: \"WCA\", name: \"Westbrook College of Art\", domain: \"wca.edu\", model: \"Pay As You Go\", paperOn: true },\n    { id: \"1063\", short: \"HPT\", name: \"Harbor Point Technical College\", domain: \"hpt.edu\", model: \"Student Purchase\", paperOn: true },\n    { id: \"1071\", short: \"MVL\", name: \"Mountain View School of Law\", domain: \"mvl.edu\", model: \"Buy All\", paperOn: true },\n    { id: \"1079\", short: \"RAM\", name: \"Riverside Academy of Music\", domain: \"ram.edu\", model: \"Pay As You Go\", paperOn: true },\n    { id: \"1086\", short: \"SSU\", name: \"Summit State University\", domain: \"ssu.edu\", model: \"Student Purchase\", paperOn: true },\n    { id: \"1092\", short: \"ECE\", name: \"Eastfield College of Engineering\", domain: \"ece.edu\", model: \"Buy All\", paperOn: true },\n    { id: \"1104\", short: \"PUO\", name: \"Pinecrest University Online\", domain: \"puo.edu\", model: \"Student Purchase\", paperOn: true },\n  ];\n  // Large-volume sample: about 3,000 records, so paging, sorting and counts can be tried at real scale (120 pages at 25 rows, 30 at 100)\n  // Display names match CC org settings › Digital credentials › Purchase option. Pay As You Go is not in org settings (pending BA).\n  static MODEL_LABEL = { \"Buy All\": \"Buy all\", \"Student Purchase\": \"Student purchase\", \"Pay As You Go\": \"Pay as you go\" };\n  static ORG_BIG = { id: \"1112\", short: \"CSU\", name: \"Commonwealth State University of Applied Sciences and Technology\", domain: \"csu.edu\", model: \"Student Purchase\", paperOn: true };\n  static ORGS = Component.ORGS_BASE.concat([Component.ORG_BIG]);\n  static BIG_LAST = [\"Abernathy\",\"Bellweather\",\"Calloway\",\"Delacroix\",\"Easterbrook\",\"Fairbanks\",\"Gallagher\",\"Hargrove\",\"Iverson\",\"Jablonski\",\"Kowalczyk\",\"Lancaster\",\"Montgomery\",\"Nakamura\",\"Oyelaran\",\"Pemberton\",\"Quintero\",\"Radcliffe\",\"Stavros\",\"Thornbury\",\"Underwood\",\"Valentine\",\"Whitmore\",\"Yamamoto\",\"Zielinski\",\"Okonkwo-Fairweather\",\"Van der Berg-Castellano\"];\n  static FIRST = [\"Aaliyah\",\"Marcus\",\"Priya\",\"Daniel\",\"Sofia\",\"Ethan\",\"Grace\",\"Omar\",\"Hannah\",\"Lucas\",\"Mei\",\"Jordan\",\"Isabel\",\"Noah\",\"Fatima\",\"Caleb\",\"Elena\",\"Ravi\",\"Chloe\",\"Andre\",\"Yuki\",\"Samuel\",\"Leah\",\"Diego\",\"Nadia\",\"Owen\",\"Amara\",\"Tyler\",\"Zoe\",\"Kwame\",\"Lily\",\"Mateo\",\"Ava\",\"Hassan\",\"Ruby\",\"Felix\",\"Imani\",\"Jonah\",\"Sara\",\"Victor\"];\n  static LAST = [\"Patel\",\"Nguyen\",\"Johnson\",\"Okafor\",\"Garcia\",\"Kim\",\"Brennan\",\"Haddad\",\"Lindqvist\",\"Moreau\",\"Chen\",\"Reyes\",\"Silva\",\"Walker\",\"Rahman\",\"Fischer\",\"Novak\",\"Sharma\",\"Dubois\",\"Wright\",\"Tanaka\",\"Osei\",\"Patel\",\"Romero\",\"Petrov\",\"Hughes\",\"Mensah\",\"Cole\",\"Ward\",\"Boateng\",\"Patel\",\"Alvarez\",\"Murphy\",\"Aziz\",\"Foster\",\"Klein\",\"Adeyemi\",\"Stone\",\"Larsen\",\"Ortiz\"];\n  static CREDS = [\n    [\"Bachelor of Arts\", [\"History\",\"Political Science\",\"Philosophy\",\"English\"]],\n    [\"Bachelor of Science\", [\"Biology\",\"Computer Science\",\"Data Science\",\"Nursing\"]],\n    [\"Master of Public Policy\", [\"\"]],\n    [\"Master of Business Administration\", [\"Finance\",\"\"]],\n    [\"Associate of Applied Science\", [\"Cybersecurity\",\"Radiologic Technology\"]],\n    [\"Certificate of Completion\", [\"Project Management\"]],\n    [\"Bachelor of Fine Arts\", [\"Studio Art\",\"Graphic Design\"]],\n  ];\n\n  // School within the organization that issued the credential (like the CC Platform's School Name column)\n  static schoolFor(cred, major) {\n    if (/Organization Development/.test(cred)) return \"School of Health Professions and Continuing Education\";\n    if (cred === \"Bachelor of Science\") return major === \"Nursing\" ? \"School of Nursing\" : (/Computer|Data/.test(major) ? \"School of Engineering\" : \"School of Arts and Sciences\");\n    if (cred === \"Associate of Applied Science\") return major === \"Cybersecurity\" ? \"School of Technology\" : \"School of Health Sciences\";\n    return ({ \"Bachelor of Arts\": \"School of Arts and Sciences\", \"Master of Public Policy\": \"School of Public Policy\", \"Master of Business Administration\": \"School of Business\",\n      \"Certificate of Completion\": \"School of Continuing Studies\", \"Bachelor of Fine Arts\": \"School of Art\" })[cred] || \"School of Arts and Sciences\";\n  }\n  // PayPal payment IDs: before 2020 \"PAY-\" + 24 characters (28 total); since then \"PAYID-\" + 24 (30 total), as on the current admin page\n  // School emails follow common US campus patterns (no \"student.\" subdomain), one pattern per organization\n  static schoolEmail(first, last, sid, org) {\n    const f = String(first).split(\" \")[0].toLowerCase().replace(/[^a-z]/g, \"\"), l = String(last).toLowerCase().replace(/[^a-z]/g, \"\"), d = org.domain;\n    const pats = [\n      () => f + \".\" + l + \"@\" + d,                    // first.last@school.edu\n      () => f[0] + l + sid.slice(-3) + \"@my.\" + d,    // flast123@my.school.edu\n      () => f + \".\" + l + sid.slice(-2) + \"@\" + d,    // first.last12@school.edu\n      () => f[0] + l + \"@mail.\" + d,                  // flast@mail.school.edu\n      () => f + l[0] + sid.slice(-4) + \"@\" + d,       // firstl1234@school.edu\n      () => l + \".\" + f + \"@g.\" + d,                  // last.first@g.school.edu\n    ];\n    const i = (parseInt(org.id, 10) || 0) % pats.length; return pats[i]();\n  }\n  static payId(p, when) { const tail = p + p.slice(0, 7).split(\"\").reverse().join(\"\"); return when.getFullYear() < 2020 ? \"PAY-\" + tail : \"PAYID-\" + tail; }\n  badgesFor(r) {\n    // Badge rules: type (Digital blue / Paper gray) and the Replacement tag are plain; status badges have a dot.\n    // Status colours: green = done, yellow = waiting, red = failed, gray = didn't happen\n    const B = (label, mod, dot) => ({ label, dot: !!dot, cls: \"cc-badge cc-badge--square\" + (mod ? \" cc-badge--\" + mod : \"\") });\n    const o = r.order, out = [B(r.type === \"digital\" ? \"Digital\" : \"Paper\", r.type === \"digital\" ? \"brand\" : \"\")];\n    if (r.type === \"digital\") {\n      if (o && o.failed) out.push(B(\"Payment failed\", \"error\", 1));\n      else out.push(r.purchased ? B(\"Purchased\", \"success\", 1) : B(\"Not purchased\", \"\", 1));\n      if (r.cr.revoked) out.push(B(\"Not valid\", \"error\", 1));\n    } else {\n      out.push(o && o.tracking ? B(\"Shipped\", \"success\", 1) : B(\"Not shipped\", \"warning\", 1));\n      if (r.repl) out.push(B(\"Replacement · \" + r.repl, \"\"));\n    }\n    return out;\n  }\n  // Fees match the student store cart: processing (11707) and shipping (11708). Standard ships free by USPS; Expedited is a UPS service priced by speed.\n  static PROC_FEE = { \"Standard\": 0, \"5-day\": 14.95, \"1-day\": 24.95 };\n  static UPS_SVC = { ground: [\"UPS Ground\", 8.95], threeDay: [\"UPS 3 Day Select\", 14.95], twoDay: [\"UPS 2nd Day Air\", 19.95], nextDaySaver: [\"UPS Next Day Air Saver\", 29.95] };\n  static shipFeeOf(o) { return o.items.some((x) => x.type === \"paper\") && o.shipService === \"Expedited\" ? Component.UPS_SVC[o.ups || \"ground\"][1] : 0; }\n  static shipLabelOf(o) { return o.shipService === \"Expedited\" ? \"Expedited · \" + Component.UPS_SVC[o.ups || \"ground\"][0] : \"Standard (free)\"; }\n  static orderTotal(ord) {\n    const PRICE = { digital: 25, paper: 45 };\n    const hasPaper = ord.items.some((x) => x.type === \"paper\");\n    const procFee = Component.PROC_FEE[ord.service] || 0;\n    const shipFee = Component.shipFeeOf(ord);\n    return ord.items.reduce((n, x) => n + (x.repl ? 0 : PRICE[x.type]), 0) + (hasPaper ? procFee : 0) + shipFee;\n  }\n  static rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }\n\n  static build() {\n    let R = Component.rng(20261124);\n    const pick = (a) => a[Math.floor(R() * a.length)];\n    const AL = \"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\";\n    const code = (n) => Array.from({ length: n }, () => AL[Math.floor(R() * AL.length)]).join(\"\");\n    const digits = (n) => Array.from({ length: n }, () => Math.floor(R() * 10)).join(\"\");\n    const day = 86400000;\n    const records = [], orders = {};\n    let recN = 0, iid = 48210;\n    const addDays = (d, n) => new Date(d.getTime() + n * day);\n    const cities = [[\"1418 Linden Ave\", \"Richmond, VA 23220\"], [\"77 Harbor St, Apt 4B\", \"Portland, ME 04101\"], [\"2903 Mesa Verde Dr\", \"Austin, TX 78745\"], [\"510 W Grand Blvd\", \"Chicago, IL 60654\"], [\"18 Orchard Ln\", \"Burlington, VT 05401\"]];\n\n    const mkOrder = (stu, when, opts) => {\n      const ref = \"CC-\" + String(when.getFullYear()).slice(2) + String(when.getMonth() + 1).padStart(2, \"0\") + \"-\" + code(5);\n      const addr = pick(cities);\n      const o = { ref, stu, submitted: when, confirmEmail: opts.failed ? null : addDays(when, 0), sale: opts.failed ? null : code(17), pay: opts.failed ? null : Component.payId(code(17), when), failed: !!opts.failed, items: [], service: opts.service || \"Standard\", shipService: opts.shipService || \"Standard\", carrier: R() > 0.5 ? \"UPS\" : \"FedEx\", shipTo: stu.name + \"\\n\" + addr[0] + \"\\n\" + addr[1], shipped: opts.shipped ? addDays(when, opts.service === \"1-day\" ? 2 : 6) : null, tracking: opts.shipped ? \"1Z\" + code(6) + digits(10) : null, contactEmail: stu.pemail || stu.semail, contactPhone: \"(\" + (200 + Math.floor(R() * 700)) + \") 555-\" + digits(4), ip: \"73.\" + Math.floor(R() * 255) + \".\" + Math.floor(R() * 255) + \".\" + Math.floor(R() * 255), cedOrderId: 900000 + Math.floor(R() * 90000) };\n      orders[ref] = o; return o;\n    };\n    const mkDigital = (stu, cr, order, purchased) => {\n      const vals = [];\n      const nv = Math.floor(R() * 5);\n      for (let i = 0; i < nv; i++) vals.push({ iid: iid++, orgId: stu.org.id, cedid: cr.cedid, date: addDays(cr.release, 20 + Math.floor(R() * 400)), ip: (R() > 0.5 ? \"98.\" : \"172.\") + Math.floor(R() * 255) + \".\" + Math.floor(R() * 255) + \".\" + Math.floor(R() * 255), valid: !cr.revoked });\n      vals.sort((a, b) => b.date - a.date);\n      const rec = { id: \"r\" + (recN++), type: \"digital\", stu, cr, order, purchased, cedid: cr.cedid, download: (purchased && R() > 0.35) ? addDays(cr.release, Math.floor(R() * 60)) : null, validations: vals, inhouse: R() > 0.85 };\n      records.push(rec); if (order) order.items.push(rec);
