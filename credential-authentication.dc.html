      window.Babel.transformScriptTags();

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

  <script type="__bundler/template">"<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"73a74846-3baa-4641-b49d-93e9be14bbb2\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<title>Credential authenticated | Paradigm<\u002Ftitle>\n<style>/* =====================================================================\n   Credential Connections — Design Tokens\n   ---------------------------------------------------------------------\n   Brand wordmark / logo navy:  rgb(41, 51, 74)   → --cc-navy\n   Brand primary action blue:   rgb(11, 108, 183) → --cc-primary-600\n   Sidebar tint (blue-25):      rgb(245, 251, 255)\n   Foundation:  Untitled UI (Inter + 25-step gray + colorful semantics)\n   ===================================================================== */\n\n/* ---------- Typeface ---------- */\n@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');\n\n:root {\n  /* ====== Brand ====== */\n  --cc-navy:            rgb(41, 51, 74);        /* wordmark + logo */\n  --cc-navy-700:        rgb(33, 41, 60);\n  --cc-navy-900:        rgb(19, 24, 36);\n\n  /* ====== Brand blue scale (used for primary actions, links, focus) ====== */\n  --blue-25:            rgb(245, 251, 255);     /* sidebar bg, callout tint */\n  --blue-50:            rgb(240, 249, 255);\n  --blue-100:           rgb(224, 242, 254);\n  --blue-200:           rgb(200, 233, 254);     /* badge border */\n  --blue-300:           rgb(125, 200, 247);\n  --blue-400:           rgb(56, 136, 197);      /* focus ring inner */\n  --blue-500:           rgb(46, 144, 250);\n  --blue-600:           rgb(11, 108, 183);      /* PRIMARY action */\n  --blue-700:           rgb(9, 98, 164);\n  --blue-800:           rgb(8, 81, 131);        /* link text, brand text */\n  --blue-900:           rgb(12, 63, 102);\n\n  /* ====== Neutral gray (Untitled UI \"gray-iron\" — warm) ====== */\n  --gray-25:            rgb(253, 253, 253);\n  --gray-50:            rgb(250, 250, 250);     /* app canvas (external) */\n  --gray-100:           rgb(245, 245, 245);\n  --gray-200:           rgb(233, 234, 235);     /* hairline border */\n  --gray-300:           rgb(213, 215, 218);     /* strong border */\n  --gray-400:           rgb(161, 165, 173);\n  --gray-500:           rgb(113, 118, 128);     /* tertiary text */\n  --gray-600:           rgb(83, 88, 98);        /* secondary text */\n  --gray-700:           rgb(65, 70, 81);        /* button label */\n  --gray-800:           rgb(39, 43, 53);\n  --gray-900:           rgb(24, 29, 39);        /* primary text */\n  --gray-950:           rgb(10, 13, 18);\n\n  /* ====== Semantic ====== */\n  --success-50:         rgb(236, 253, 243);\n  --success-200:        rgb(171, 239, 198);\n  --success-500:        rgb(23, 178, 106);\n  --success-700:        rgb(6, 118, 71);\n\n  --warning-50:         rgb(255, 250, 235);\n  --warning-200:        rgb(254, 223, 137);\n  --warning-500:        rgb(247, 144, 9);\n  --warning-700:        rgb(181, 71, 8);\n\n  --error-50:           rgb(254, 243, 242);\n  --error-200:          rgb(254, 205, 202);\n  --error-500:          rgb(240, 68, 56);\n  --error-700:          rgb(180, 35, 24);\n\n  /* ====== Aliases used by Untitled-UI components in the Figma file ====== */\n  --bg-primary:         #ffffff;\n  --bg-secondary:       var(--gray-50);\n  --bg-tertiary:        var(--gray-100);\n  --bg-brand-subtle:    var(--blue-25);\n\n  --fg-primary:         var(--gray-900);\n  --fg-secondary:       var(--gray-600);\n  --fg-tertiary:        var(--gray-500);\n  --fg-quaternary:      var(--gray-400);\n  --fg-brand:           var(--blue-600);\n  --fg-on-brand:        #ffffff;\n\n  --border-primary:     var(--gray-200);\n  --border-secondary:   var(--gray-100);\n  --border-strong:      var(--gray-300);\n  --border-brand:       var(--blue-600);\n  --border-input:       rgb(140, 145, 153);   /* active input borders: 3.17:1 on white, 3.04:1 on gray-50 */\n\n  /* ====== Overlays (gray-950 at fixed opacity) ====== */\n  --overlay-backdrop:   rgba(10, 13, 18, 0.40);   /* scrim behind dialogs + drawers */\n  --overlay-icon:       rgba(10, 13, 18, 0.60);   /* icon circles on images */\n  --overlay-icon-hover: rgba(10, 13, 18, 0.75);   /* hover + focus of those circles */\n\n  /* ====== Type system (Inter, Untitled UI scale) ====== */\n  --font-display: 'Inter', system-ui, -apple-system, sans-serif;\n  --font-body:    'Inter', system-ui, -apple-system, sans-serif;\n  --font-mono:    'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* Display */\n  --text-display-2xl-size: 72px;  --text-display-2xl-lh: 90px;  --text-display-2xl-tracking: -0.02em;\n  --text-display-xl-size:  60px;  --text-display-xl-lh:  72px;  --text-display-xl-tracking:  -0.02em;\n  --text-display-lg-size:  48px;  --text-display-lg-lh:  60px;  --text-display-lg-tracking:  -0.02em;\n  --text-display-md-size:  36px;  --text-display-md-lh:  44px;  --text-display-md-tracking:  -0.02em;\n  --text-display-sm-size:  30px;  --text-display-sm-lh:  38px;\n  --text-display-xs-size:  24px;  --text-display-xs-lh:  32px;\n\n  /* Body */\n  --text-xl-size: 20px;  --text-xl-lh: 30px;\n  --text-lg-size: 18px;  --text-lg-lh: 28px;\n  --text-md-size: 16px;  --text-md-lh: 24px;\n  --text-smed-size: 15px;  --text-smed-lh: 22px;\n  --text-sm-size: 14px;  --text-sm-lh: 20px;\n  --text-xs-size: 12px;  --text-xs-lh: 18px;\n\n  /* Weights (Inter) */\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n  --fw-bold:     700;\n\n  /* ====== Spacing (4-pt scale) ====== */\n  --space-0: 0;\n  --space-0_5: 2px;\n  --space-1: 4px;\n  --space-1_5: 6px;\n  --space-2: 8px;\n  --space-2_5: 10px;\n  --space-3: 12px;\n  --space-3_5: 14px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* ====== Radius ====== */\n  --radius-none: 0;\n  --radius-xxs:  2px;\n  --radius-xs:   4px;\n  --radius-sm:   6px;\n  --radius-md:   8px;     /* default for buttons */\n  --radius-lg:   10px;\n  --radius-xl:   12px;    /* default for cards */\n  --radius-2xl:  16px;\n  --radius-3xl:  20px;\n  --radius-4xl:  24px;\n  --radius-full: 9999px;\n\n  /* ====== Shadows (Untitled UI elevation) ====== */\n  --shadow-xs: 0 1px 2px 0 rgba(10, 13, 18, 0.05);\n  --shadow-sm: 0 1px 3px 0 rgba(10, 13, 18, 0.10), 0 1px 2px -1px rgba(10, 13, 18, 0.10);\n  --shadow-md: 0 4px 6px -1px rgba(10, 13, 18, 0.08), 0 2px 4px -2px rgba(10, 13, 18, 0.06);\n  --shadow-lg: 0 12px 16px -4px rgba(10, 13, 18, 0.08), 0 4px 6px -2px rgba(10, 13, 18, 0.03);\n  --shadow-xl: 0 20px 24px -4px rgba(10, 13, 18, 0.08), 0 8px 8px -4px rgba(10, 13, 18, 0.03);\n  --shadow-2xl: 0 24px 48px -12px rgba(10, 13, 18, 0.18);\n  --shadow-3xl: 0 32px 64px -12px rgba(10, 13, 18, 0.14);\n\n  /* Inset accents used on inputs + primary buttons */\n  --shadow-button-primary: 0 1px 2px 0 rgba(10,13,18,0.05), inset 0 0 0 1px rgba(0,0,0,0.20);\n  --shadow-button-secondary: 0 1px 2px 0 rgba(10,13,18,0.05), inset 0 -2px 0 0 rgba(10,13,18,0.05);\n  --ring-focus: 0 0 0 2px var(--blue-400);\n\n  /* ====== Z ====== */\n  --z-dropdown: 50;\n  --z-overlay:  100;\n  --z-modal:    200;\n  --z-toast:    300;\n}\n\n/* =====================================================================\n   Semantic role aliases — components reach for these (h1, p, code…)\n   ===================================================================== */\n:where(body, html) {\n  font-family: var(--font-body);\n  color: var(--fg-primary);\n  background: var(--bg-primary);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\n.cc-display-2xl { font: var(--fw-semibold) var(--text-display-2xl-size)/var(--text-display-2xl-lh) var(--font-display); letter-spacing: var(--text-display-2xl-tracking); color: var(--fg-primary); }\n.cc-display-xl  { font: var(--fw-semibold) var(--text-display-xl-size)/var(--text-display-xl-lh)   var(--font-display); letter-spacing: var(--text-display-xl-tracking);  color: var(--fg-primary); }\n.cc-display-lg  { font: var(--fw-semibold) var(--text-display-lg-size)/var(--text-display-lg-lh)   var(--font-display); letter-spacing: var(--text-display-lg-tracking);  color: var(--fg-primary); }\n.cc-display-md  { font: var(--fw-semibold) var(--text-display-md-size)/var(--text-display-md-lh)   var(--font-display); letter-spacing: var(--text-display-md-tracking);  color: var(--fg-primary); }\n.cc-display-sm  { font: var(--fw-semibold) var(--text-display-sm-size)/var(--text-display-sm-lh)   var(--font-display); color: var(--fg-primary); }\n.cc-display-xs  { font: var(--fw-semibold) var(--text-display-xs-size)/var(--text-display-xs-lh)   var(--font-display); color: var(--fg-primary); }\n\n.cc-h1 { font: var(--fw-semibold) 30px/38px var(--font-display); letter-spacing: -0.01em; color: var(--fg-primary); }\n.cc-h2 { font: var(--fw-semibold) 24px/32px var(--font-display); color: var(--fg-primary); }\n.cc-h3 { font: var(--fw-semibold) 20px/30px var(--font-display); color: var(--fg-primary); }\n.cc-h4 { font: var(--fw-semibold) 18px/28px var(--font-display); color: var(--fg-primary); }\n\n.cc-text-xl { font: var(--fw-regular) var(--text-xl-size)/var(--text-xl-lh) var(--font-body); color: var(--fg-primary); }\n.cc-text-lg { font: var(--fw-regular) var(--text-lg-size)/var(--text-lg-lh) var(--font-body); color: var(--fg-primary); }\n.cc-text-md { font: var(--fw-regular) var(--text-md-size)/var(--text-md-lh) var(--font-body); color: var(--fg-primary); }\n.cc-text-smed { font: var(--fw-regular) var(--text-smed-size)/var(--text-smed-lh) var(--font-body); color: var(--fg-primary); }\n.cc-text-sm { font: var(--fw-regular) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--fg-primary); }\n.cc-text-xs { font: var(--fw-regular) var(--tex
