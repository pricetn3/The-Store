<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="assets/cc-tokens.css">
<script src="./image-slot.js"></script>
</helmet>

<div style="width: 100%; max-width: 640px; font-family: var(--font-body); color: var(--gray-900);">
  <div style="background: var(--surface); border: 1px solid var(--gray-200); border-radius: 12px; box-shadow: var(--shadow-xs); padding: 24px 24px 26px;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div style="min-width: 0;">
        <h2 style="font: var(--fw-semibold) var(--text-md-size)/var(--text-md-lh) var(--font-display); color: var(--gray-900); margin: 0 0 3px;">Institutions</h2>
        <p style="font: var(--fw-regular) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-500); margin: 0;">{{ countLabel }}</p>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; flex-shrink: 0; font: var(--fw-medium) var(--text-xs-size)/var(--text-xs-lh) var(--font-body); color: var(--gray-500); background: var(--gray-100); border-radius: 999px; padding: 3px 10px;">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Read-only
      </span>
    </div>


    <div role="list" style="display: flex; flex-direction: column; gap: 10px; margin-top: 16px;">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="2">
        <div role="listitem" style="{{ it.row }}">
          <div style="min-width: 0; flex: 1;">
            <div style="font: var(--fw-semibold) var(--text-sm-size)/var(--text-sm-lh) var(--font-display); color: var(--gray-900); text-align: left;">{{ it.name }}</div>
            <div style="font: var(--fw-regular) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-500);">{{ it.sub }}</div>
          </div>
          <span style="{{ it.logoWrap }}">
            <sc-if value="{{ it.hasLogo }}" hint-placeholder-val="{{ false }}">
              <img src="{{ it.logoSrc }}" alt="{{ it.name }}" style="width: 100%; height: 100%; object-fit: contain;">
            </sc-if>
            <sc-if value="{{ it.noLogo }}" hint-placeholder-val="{{ true }}">
              <image-slot id="{{ it.logoId }}" shape="rect" fit="contain" placeholder="Logo" style="width: 100%; height: 100%;"></image-slot>
            </sc-if>
          </span>
        </div>
      </sc-for>
    </div>

    <p style="font: var(--fw-regular) var(--text-xs-size)/var(--text-xs-lh) var(--font-body); color: var(--gray-400); margin: 14px 2px 0; text-wrap: pretty;">Institution affiliations are managed by your schools and can't be changed here.</p>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  institutions() {
    return [
      { id: "vhu", name: "Virginia Hanock University", sub: "Virginia Beach, Virginia", logo: "assets/logos/vhu-crest.svg" },
      { id: "vhgs", name: "Virginia Hanock Graduate School", sub: "Virginia Beach, Virginia", logo: "assets/logos/vhgs-wordmark.png" },
    ];
  }
  renderVals() {
    const list = this.institutions();
    const items = list.map((it) => ({
      name: it.name, sub: it.sub, logoId: "org-logo-" + it.id, hasLogo: !!it.logo, noLogo: !it.logo, logoSrc: it.logo || "",
      row: { display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16, padding: "12px 16px", border: "1px solid var(--gray-200)", borderRadius: 10, background: "var(--surface)" },
      logoWrap: { width: 130, height: 44, flexShrink: 0, display: "inline-flex", alignItems: "center", justifyContent: "flex-end" },
    }));
    return { items, countLabel: list.length + (list.length === 1 ? " institution" : " institutions") };
  }
}

</script>
</body>
</html>
