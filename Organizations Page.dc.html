        Read-only

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  institutions() {
    return [
      { id: "vhu", name: "Virginia Hanock University", sub: "Virginia Beach, Virginia", logo: "assets/logos/vhu-crest.svg" },
      { id: "vhgs", name: "Virginia Hanock Graduate School", sub: "Virginia Beach, Virginia", logo: "assets/logos/vhgs-wordmark.png" },
    ];
  }
  renderVals() {
    const list = this.institutions();
    const items = list.map((it) => ({
      name: it.name, sub: it.sub, logoId: "org-logo-" + it.id, isVhu: it.id === "vhu", isVhgs: it.id === "vhgs", noLogo: !it.logo,
      row: { display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16, padding: "12px 16px", border: "1px solid var(--gray-200)", borderRadius: 10, background: "var(--surface)" },
      logoWrap: { width: 130, height: 44, flexShrink: 0, display: "inline-flex", alignItems: "center", justifyContent: "flex-end" },
    }));
    return { items, countLabel: list.length + (list.length === 1 ? " institution" : " institutions") };
  }
}
