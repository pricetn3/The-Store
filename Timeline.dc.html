<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="stylesheet" href="assets/cc-tokens.css">
</helmet>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; align-items: flex-start; width: 100%;">
    <sc-for list="{{ steps }}" as="step" hint-placeholder-count="4">
      <div style="display: flex; align-items: flex-start; flex: 1;">
        <div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0;">
          <div style="{{ step.dotStyle }}">
            <sc-if value="{{ step.done }}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
            </sc-if>
          </div>
          <span style="{{ step.labelStyle }}">{{ step.label }}</span>
        </div>
        <sc-if value="{{ step.hasLine }}" hint-placeholder-val="{{ true }}">
          <div style="{{ step.lineStyle }}"></div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</sc-if>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
  <div style="display: flex; flex-direction: column;">
    <sc-for list="{{ steps }}" as="step" hint-placeholder-count="4">
      <div style="display: flex; gap: 12px;">
        <div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0;">
          <div style="{{ step.dotStyle }}">
            <sc-if value="{{ step.done }}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
            </sc-if>
          </div>
          <sc-if value="{{ step.hasLine }}" hint-placeholder-val="{{ true }}">
            <div style="{{ step.vLineStyle }}"></div>
          </sc-if>
        </div>
        <span style="{{ step.vLabelStyle }}">{{ step.label }}</span>
      </div>
    </sc-for>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const desktop = this.props.desktop !== false && !this.props.mobile;
    const labels = this.props.labels || ["Approved", "Processing", "Shipped", "Delivered"];
    const currentIdx = typeof this.props.currentIndex === "number" ? this.props.currentIndex : 1;
    const n = labels.length;
    const font = "var(--font-body)";

    const steps = labels.map((label, i) => {
      const done = i < currentIdx;
      const current = i === currentIdx;
      const active = done || current;
      const bg = done ? "var(--blue-600)" : current ? "#fff" : "var(--gray-100)";
      const border = active ? "var(--blue-600)" : "var(--gray-300)";
      const lineActive = i < currentIdx;
      return {
        label,
        done,
        hasLine: i < n - 1,
        dotStyle: {
          width: 22, height: 22, borderRadius: "50%", flexShrink: 0,
          background: bg, border: "2px solid " + border,
          display: "flex", alignItems: "center", justifyContent: "center",
          boxSizing: "border-box",
        },
        labelStyle: {
          marginTop: 8, textAlign: "center", font: (active ? "var(--fw-semibold)" : "var(--fw-regular)") + " 12px/16px " + font,
          color: active ? "var(--gray-900)" : "var(--gray-500)", maxWidth: 90,
        },
        lineStyle: {
          flex: 1, height: 2, marginTop: 10, background: lineActive ? "var(--blue-600)" : "var(--gray-200)",
        },
        vLineStyle: { width: 2, flex: 1, minHeight: 24, margin: "4px 0", background: lineActive ? "var(--blue-600)" : "var(--gray-200)" },
        vLabelStyle: {
          font: (active ? "var(--fw-semibold)" : "var(--fw-regular)") + " 14px/22px " + font,
          color: active ? "var(--gray-900)" : "var(--gray-500)", paddingBottom: 20,
        },
      };
    });

    return { isDesktop: desktop, isMobile: !desktop, steps };
  }
}
</script>
</body>
</html>
