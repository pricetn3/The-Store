<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .sp-close-tip { opacity: 0; visibility: hidden; transition: opacity .15s ease; }
  .sp-close:hover .sp-close-tip, .sp-close:focus-within .sp-close-tip { opacity: 1; visibility: visible; }
</style>
</helmet>
<div style="{{ data.wrap }}">
  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
    <div style="min-width: 0;">
      <h2 style="font: var(--fw-semibold) var(--text-md-size)/var(--text-md-lh) var(--font-display); color: var(--gray-900); margin: 0 0 3px;">Password</h2>
      <div style="font: var(--fw-regular) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-500); margin-top: 2px;">Last changed {{ data.lastChanged }}</div>
    </div>
    <button onClick="{{ data.onEdit }}" style="{{ data.btnEdit }}" style-hover="{{ data.btnSecondaryHover }}" style-focus="{{ data.focusRing }}">
      Change password
    </button>
  </div>

  <sc-if value="{{ data.edit }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 210; background: rgba(10,13,18,0.40); display: flex; align-items: center; justify-content: center; padding: 24px 16px;">
      <div role="dialog" aria-modal="true" aria-label="Change password" style="width: 100%; max-width: 480px; max-height: calc(100vh - 48px); overflow-y: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-xl); padding: 22px 22px 20px; box-sizing: border-box; animation: cc-rise 0.18s cubic-bezier(0.2,0.6,0.2,1);">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
          <div style="min-width: 0;">
            <h2 style="font: var(--fw-semibold) var(--text-md-size)/var(--text-md-lh) var(--font-display); color: var(--gray-900); margin: 0 0 3px;">Change password</h2>
            <p style="font: var(--fw-regular) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-500); margin: 0;">Last changed {{ data.lastChanged }}</p>
          </div>
          <div class="sp-close" style="position: relative; display: inline-flex; border-radius: 8px; flex-shrink: 0;">
            <button onClick="{{ data.onCancel }}" aria-label="Close" style="{{ data.closeBtn }}" style-hover="{{ data.eyeHover }}" style-focus="{{ data.focusRing }}">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
            </button>
            <div class="sp-close-tip" style="position: absolute; top: calc(100% + 8px); right: 0; z-index: 90; pointer-events: none; white-space: nowrap; background: var(--gray-900); color: #fff; border-radius: var(--radius-sm); padding: 4px 8px; font: var(--fw-medium) var(--text-xs-size)/var(--text-xs-lh) var(--font-body); box-shadow: var(--shadow-md);">Close</div>
          </div>
        </div>

        <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 20px;">
          <label style="display: block;">
            <span style="display: block; font: var(--fw-medium) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-700); margin-bottom: 6px;">Current password</span>
            <div style="position: relative;">
              <input value="{{ data.curVal }}" onChange="{{ data.onCur }}" type="{{ data.curType }}" autoComplete="current-password" style="{{ data.pwInputStyle }}" style-focus="{{ data.inputFocus }}">
              <button onClick="{{ data.onToggleCur }}" type="button" aria-label="Show or hide password" style="{{ data.eyeBtn }}" style-hover="{{ data.eyeHover }}" style-focus="{{ data.focusRing }}">{{ data.curEye }}</button>
            </div>
          </label>

          <label style="display: block;">
            <span style="display: block; font: var(--fw-medium) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-700); margin-bottom: 6px;">New password</span>
            <div style="position: relative;">
              <input value="{{ data.newVal }}" onChange="{{ data.onNew }}" type="{{ data.newType }}" autoComplete="new-password" style="{{ data.pwInputStyle }}" style-focus="{{ data.inputFocus }}">
              <button onClick="{{ data.onToggleNew }}" type="button" aria-label="Show or hide password" style="{{ data.eyeBtn }}" style-hover="{{ data.eyeHover }}" style-focus="{{ data.focusRing }}">{{ data.newEye }}</button>
            </div>
            <div role="list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 12px;">
              <sc-for list="{{ data.checks }}" as="ck" hint-placeholder-count="4">
                <span role="listitem" style="display: inline-flex; align-items: center; gap: 7px; font: {{ ck.weight }} 12px/17px var(--font-body); color: {{ ck.color }};">
                  <span style="{{ ck.iconWrap }}" aria-hidden="true">{{ ck.icon }}</span>{{ ck.label }}
                </span>
              </sc-for>
            </div>
          </label>

          <label style="display: block;">
            <span style="display: block; font: var(--fw-medium) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-700); margin-bottom: 6px;">Confirm new password</span>
            <div style="position: relative;">
              <input value="{{ data.confVal }}" onChange="{{ data.onConf }}" type="{{ data.confType }}" autoComplete="new-password" style="{{ data.confInputStyle }}" style-focus="{{ data.inputFocus }}">
              <button onClick="{{ data.onToggleConf }}" type="button" aria-label="Show or hide password" style="{{ data.eyeBtn }}" style-hover="{{ data.eyeHover }}" style-focus="{{ data.focusRing }}">{{ data.confEye }}</button>
            </div>
            <sc-if value="{{ data.confErr }}" hint-placeholder-val="{{ false }}">
              <span style="display: inline-flex; align-items: center; gap: 5px; font: var(--fw-medium) var(--text-xs-size)/var(--text-xs-lh) var(--font-body); color: var(--error-700); margin-top: 6px;">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--error-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
                Enter a matching password
              </span>
            </sc-if>
          </label>

          <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; padding: 12px 13px; border: 1px solid var(--gray-200); border-radius: 10px; background: var(--gray-25);">
            <input type="checkbox" checked="{{ data.signOut }}" onChange="{{ data.onSignOut }}" style="width: 16px; height: 16px; margin-top: 2px; accent-color: var(--blue-600); flex-shrink: 0;">
            <span style="min-width: 0;">
              <span style="display: block; font: var(--fw-medium) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-800);">Sign out of other devices</span>
              <span style="display: block; font: var(--fw-regular) var(--text-xs-size)/var(--text-xs-lh) var(--font-body); color: var(--gray-500); text-wrap: pretty;">Ends every other active session. You'll stay signed in here.</span>
            </span>
          </label>

          <p style="font: var(--fw-regular) var(--text-xs-size)/var(--text-xs-lh) var(--font-body); color: var(--gray-500); margin: 0; text-wrap: pretty;">If your institution uses single sign-on, your password is managed there and this section may not apply.</p>

          <div style="{{ data.footer }}">
            <button onClick="{{ data.onCancel }}" style="{{ data.btnSecondary }}" style-hover="{{ data.btnSecondaryHover }}" style-focus="{{ data.focusRing }}">Cancel</button>
            <button onClick="{{ data.onSave }}" aria-disabled="{{ data.saveAria }}" style="{{ data.saveStyle }}" style-hover="{{ data.btnPrimaryHover }}" style-focus="{{ data.focusRing }}">Update password</button>
          </div>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:220}}"></script>
</body>
</html>
