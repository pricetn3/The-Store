<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <label style="display: block; margin-bottom: 14px;">
    <span style="display: block; font: var(--fw-medium) 13px/18px var(--font-body); color: var(--gray-700); margin-bottom: 6px;">Full name</span>
    <input value="{{ fullName }}" onChange="{{ onFullName }}" autoComplete="name" placeholder="Full name" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px; border: none; border-radius: var(--radius-md); font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-900); background: #fff; outline: none; box-shadow: inset 0 0 0 1px var(--gray-300);" style-focus="{{ inputFocus }}">
  </label>

  <label style="display: block; margin-bottom: 14px;">
    <span style="display: block; font: var(--fw-medium) 13px/18px var(--font-body); color: var(--gray-700); margin-bottom: 6px;">Street address</span>
    <input value="{{ street }}" onChange="{{ onStreet }}" autoComplete="address-line1" placeholder="Street address" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px; border: none; border-radius: var(--radius-md); font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-900); background: #fff; outline: none; box-shadow: inset 0 0 0 1px var(--gray-300);" style-focus="{{ inputFocus }}">
  </label>

  <label style="display: block; margin-bottom: 14px;">
    <span style="display: block; font: var(--fw-medium) 13px/18px var(--font-body); color: var(--gray-700); margin-bottom: 6px;">Apt / Suite <span style="color: var(--gray-400); font-weight: 400;">(optional)</span></span>
    <input value="{{ apt }}" onChange="{{ onApt }}" autoComplete="address-line2" placeholder="Apt, suite, unit" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px; border: none; border-radius: var(--radius-md); font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-900); background: #fff; outline: none; box-shadow: inset 0 0 0 1px var(--gray-300);" style-focus="{{ inputFocus }}">
  </label>

  <div style="margin-bottom: 14px;">
    <div style="{{ tripletStyle }}">
      <label style="display: block;">
        <span style="display: block; font: var(--fw-medium) 13px/18px var(--font-body); color: var(--gray-700); margin-bottom: 6px;">City</span>
        <input value="{{ city }}" onChange="{{ onCity }}" autoComplete="address-level2" placeholder="City" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px; border: none; border-radius: var(--radius-md); font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-900); background: #fff; outline: none; box-shadow: inset 0 0 0 1px var(--gray-300);" style-focus="{{ inputFocus }}">
      </label>
      <label style="display: block;">
        <span style="display: block; font: var(--fw-medium) 13px/18px var(--font-body); color: var(--gray-700); margin-bottom: 6px;">State</span>
        <input value="{{ stateV }}" onChange="{{ onStateV }}" autoComplete="address-level1" placeholder="State" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px; border: none; border-radius: var(--radius-md); font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-900); background: #fff; outline: none; box-shadow: inset 0 0 0 1px var(--gray-300);" style-focus="{{ inputFocus }}">
      </label>
      <label style="display: block;">
        <span style="display: block; font: var(--fw-medium) 13px/18px var(--font-body); color: var(--gray-700); margin-bottom: 6px;">ZIP</span>
        <input value="{{ zip }}" onChange="{{ onZip }}" autoComplete="postal-code" placeholder="ZIP" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px; border: none; border-radius: var(--radius-md); font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-900); background: #fff; outline: none; box-shadow: inset 0 0 0 1px var(--gray-300);" style-focus="{{ inputFocus }}">
      </label>
    </div>
  </div>

  <label style="display: block;">
    <span style="display: block; font: var(--fw-medium) 13px/18px var(--font-body); color: var(--gray-700); margin-bottom: 6px;">Country</span>
    <select value="{{ country }}" onChange="{{ onCountry }}" autoComplete="country-name" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px; border: none; border-radius: var(--radius-md); font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-900); background: #fff; outline: none; box-shadow: inset 0 0 0 1px var(--gray-300); appearance: none; background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2220%22 height=%2220%22 fill=%22none%22 stroke=%22%23717680%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22m6 9 6 6 6-6%22/></svg>'); background-repeat: no-repeat; background-position: right 10px center;" style-focus="{{ inputFocus }}">
      <option>United States</option>
      <option>Canada</option>
      <option>United Kingdom</option>
      <option>Australia</option>
    </select>
  </label>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:480}}"></script>
</body>
</html>
