<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ data.wrap }}">
  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
    <div style="min-width: 0;">
      <h2 style="font: var(--fw-semibold) var(--text-md-size)/var(--text-md-lh) var(--font-display); color: var(--gray-900); margin: 0 0 3px;">{{ data.title }}</h2>
      <p style="font: var(--fw-regular) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-500); margin: 0;">{{ data.subtitle }}</p>
    </div>
    <sc-if value="{{ data.view }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ data.onEdit }}" style="{{ data.btnEdit }}" style-hover="{{ data.btnSecondaryHover }}" style-focus="{{ data.focusRing }}">
        Edit
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ data.view }}" hint-placeholder-val="{{ true }}">
    <div style="{{ data.infoGrid }}">
      <div><span style="{{ data.fieldLabel }}">First name</span><div style="font: var(--fw-medium) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-900);">{{ data.first }}</div></div>
      <div><span style="{{ data.fieldLabel }}">Last name</span><div style="font: var(--fw-medium) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-900);">{{ data.last }}</div></div>
      <div><span style="{{ data.fieldLabel }}">Phone number</span><div style="font: var(--fw-medium) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-900);">{{ data.phone }}</div></div>
      <div><span style="{{ data.fieldLabel }}">Email</span><div style="font: var(--fw-medium) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--gray-900); overflow-wrap: anywhere;">{{ data.email }}</div></div>
    </div>
  </sc-if>

  <sc-if value="{{ data.edit }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top: 16px;">
      <div style="{{ data.formRow }}">
        <label style="display: block;">
          <span style="{{ data.fieldLabel }}">First name</span>
          <input value="{{ data.dFirst }}" onChange="{{ data.onFirst }}" autoComplete="given-name" style="{{ data.inputStyle }}" style-focus="{{ data.inputFocus }}">
        </label>
        <label style="display: block;">
          <span style="{{ data.fieldLabel }}">Last name</span>
          <input value="{{ data.dLast }}" onChange="{{ data.onLast }}" autoComplete="family-name" style="{{ data.inputStyle }}" style-focus="{{ data.inputFocus }}">
        </label>
      </div>
      <div style="margin-top: 20px;">
      <div style="{{ data.formRow }}" data-row="2">
        <label style="display: block;">
          <span style="{{ data.fieldLabel }}">Phone number</span>
          <input value="{{ data.dPhone }}" onChange="{{ data.onPhone }}" inputMode="tel" autoComplete="tel" style="{{ data.inputStyle }}" style-focus="{{ data.inputFocus }}">
        </label>
        <label style="display: block;">
          <span style="{{ data.fieldLabel }}">Email</span>
          <input value="{{ data.dEmail }}" onChange="{{ data.onEmailField }}" type="email" inputMode="email" autoComplete="email" style="{{ data.inputStyle }}" style-focus="{{ data.inputFocus }}">
        </label>
      </div>
      </div>
      <div style="{{ data.footer }}">
        <button onClick="{{ data.onCancel }}" style="{{ data.btnSecondary }}" style-hover="{{ data.btnSecondaryHover }}" style-focus="{{ data.focusRing }}">Cancel</button>
        <button onClick="{{ data.onSave }}" style="{{ data.btnPrimary }}" style-hover="{{ data.btnPrimaryHover }}" style-focus="{{ data.focusRing }}">Save changes</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:320}}"></script>
</body>
</html>
