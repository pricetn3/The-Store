    // document mints the blobs for its OWN frames, obtaining page text

    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      delete pendingRelays[uuid];

      // root's never-relay rule) are what hold in fully opaque chains

    const resourceMap = {};

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    // DOMParser/replaceWith are inert per spec — re-create each with

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"4c896501-35f6-47a9-8f26-9df4f1fb20d1\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<title>Credential Validation | Virginia Hanock University<\u002Ftitle>\n<style>/* =====================================================================\n   Credential Connections — Design Tokens\n   ---------------------------------------------------------------------\n   Brand wordmark / logo navy:  rgb(41, 51, 74)   → --cc-navy\n   Brand primary action blue:   rgb(11, 108, 183) → --cc-primary-600\n   Sidebar tint (blue-25):      rgb(245, 251, 255)\n   Foundation:  Untitled UI (Inter + 25-step gray + colorful semantics)\n   ===================================================================== */\n\n/* ---------- Typeface ---------- */\n@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');\n\n:root {\n  /* ====== Brand ====== */\n  --cc-navy:            rgb(41, 51, 74);        /* wordmark + logo */\n  --cc-navy-700:        rgb(33, 41, 60);\n  --cc-navy-900:        rgb(19, 24, 36);\n\n  /* ====== Brand blue scale (used for primary actions, links, focus) ====== */\n  --blue-25:            rgb(245, 251, 255);     /* sidebar bg, callout tint */\n  --blue-50:            rgb(240, 249, 255);\n  --blue-100:           rgb(224, 242, 254);\n  --blue-200:           rgb(200, 233, 254);     /* badge border */\n  --blue-300:           rgb(125, 200, 247);\n  --blue-400:           rgb(56, 136, 197);      /* focus ring inner */\n  --blue-500:           rgb(46, 144, 250);\n  --blue-600:           rgb(11, 108, 183);      /* PRIMARY action */\n  --blue-700:           rgb(9, 98, 164);\n  --blue-800:           rgb(8, 81, 131);        /* link text, brand text */\n  --blue-900:           rgb(12, 63, 102);\n\n  /* ====== Neutral gray (Untitled UI \"gray-iron\" — warm) ====== */\n  --gray-25:            rgb(253, 253, 253);\n  --gray-50:            rgb(250, 250, 250);     /* app canvas (external) */\n  --gray-100:           rgb(245, 245, 245);\n  --gray-200:           rgb(233, 234, 235);     /* hairline border */\n  --gray-300:           rgb(213, 215, 218);     /* strong border */\n  --gray-400:           rgb(161, 165, 173);\n  --gray-500:           rgb(113, 118, 128);     /* tertiary text */\n  --gray-600:           rgb(83, 88, 98);        /* secondary text */\n  --gray-700:           rgb(65, 70, 81);        /* button label */\n  --gray-800:           rgb(39, 43, 53);\n  --gray-900:           rgb(24, 29, 39);        /* primary text */\n  --gray-950:           rgb(10, 13, 18);\n\n  /* ====== Semantic ====== */\n  --success-50:         rgb(236, 253, 243);\n  --success-200:        rgb(171, 239, 198);\n  --success-500:        rgb(23, 178, 106);\n  --success-700:        rgb(6, 118, 71);\n\n  --warning-50:         rgb(255, 250, 235);\n  --warning-200:        rgb(254, 223, 137);\n  --warning-500:        rgb(247, 144, 9);\n  --warning-700:        rgb(181, 71, 8);\n\n  --error-50:           rgb(254, 243, 242);\n  --error-200:          rgb(254, 205, 202);\n  --error-500:          rgb(240, 68, 56);\n  --error-700:          rgb(180, 35, 24);\n\n  /* ====== Aliases used by Untitled-UI components in the Figma file ====== */\n  --bg-primary:         #ffffff;\n  --bg-secondary:       var(--gray-50);\n  --bg-tertiary:        var(--gray-100);\n  --bg-brand-subtle:    var(--blue-25);\n\n  --fg-primary:         var(--gray-900);\n  --fg-secondary:       var(--gray-600);\n  --fg-tertiary:        var(--gray-500);\n  --fg-quaternary:      var(--gray-400);\n  --fg-brand:           var(--blue-600);\n  --fg-on-brand:        #ffffff;\n\n  --border-primary:     var(--gray-200);\n  --border-secondary:   var(--gray-100);\n  --border-strong:      var(--gray-300);\n  --border-brand:       var(--blue-600);\n\n  /* ====== Type system (Inter, Untitled UI scale) ====== */\n  --font-display: 'Inter', system-ui, -apple-system, sans-serif;\n  --font-body:    'Inter', system-ui, -apple-system, sans-serif;\n  --font-mono:    'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* Display */\n  --text-display-2xl-size: 72px;  --text-display-2xl-lh: 90px;  --text-display-2xl-tracking: -0.02em;\n  --text-display-xl-size:  60px;  --text-display-xl-lh:  72px;  --text-display-xl-tracking:  -0.02em;\n  --text-display-lg-size:  48px;  --text-display-lg-lh:  60px;  --text-display-lg-tracking:  -0.02em;\n  --text-display-md-size:  36px;  --text-display-md-lh:  44px;  --text-display-md-tracking:  -0.02em;\n  --text-display-sm-size:  30px;  --text-display-sm-lh:  38px;\n  --text-display-xs-size:  24px;  --text-display-xs-lh:  32px;\n\n  /* Body */\n  --text-xl-size: 20px;  --text-xl-lh: 30px;\n  --text-lg-size: 18px;  --text-lg-lh: 28px;\n  --text-md-size: 16px;  --text-md-lh: 24px;\n  --text-sm-size: 14px;  --text-sm-lh: 20px;\n  --text-15-size: 15px;  --text-15-lh: 22px;\n  --text-xs-size: 12px;  --text-xs-lh: 18px;\n\n  /* Weights (Inter) */\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n  --fw-bold:     700;\n\n  /* ====== Spacing (4-pt scale) ====== */\n  --space-0: 0;\n  --space-0_5: 2px;\n  --space-1: 4px;\n  --space-1_5: 6px;\n  --space-2: 8px;\n  --space-2_5: 10px;\n  --space-3: 12px;\n  --space-3_5: 14px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* ====== Radius ====== */\n  --radius-none: 0;\n  --radius-xxs:  2px;\n  --radius-xs:   4px;\n  --radius-sm:   6px;\n  --radius-md:   8px;     /* default for buttons */\n  --radius-lg:   10px;\n  --radius-xl:   12px;    /* default for cards */\n  --radius-2xl:  16px;\n  --radius-3xl:  20px;\n  --radius-4xl:  24px;\n  --radius-full: 9999px;\n\n  /* ====== Shadows (Untitled UI elevation) ====== */\n  --shadow-xs: 0 1px 2px 0 rgba(10, 13, 18, 0.05);\n  --shadow-sm: 0 1px 3px 0 rgba(10, 13, 18, 0.10), 0 1px 2px -1px rgba(10, 13, 18, 0.10);\n  --shadow-md: 0 4px 6px -1px rgba(10, 13, 18, 0.08), 0 2px 4px -2px rgba(10, 13, 18, 0.06);\n  --shadow-lg: 0 12px 16px -4px rgba(10, 13, 18, 0.08), 0 4px 6px -2px rgba(10, 13, 18, 0.03);\n  --shadow-xl: 0 20px 24px -4px rgba(10, 13, 18, 0.08), 0 8px 8px -4px rgba(10, 13, 18, 0.03);\n  --shadow-2xl: 0 24px 48px -12px rgba(10, 13, 18, 0.18);\n  --shadow-3xl: 0 32px 64px -12px rgba(10, 13, 18, 0.14);\n\n  /* Inset accents used on inputs + primary buttons */\n  --shadow-button-primary: 0 1px 2px 0 rgba(10,13,18,0.05), inset 0 0 0 1px rgba(0,0,0,0.20);\n  --shadow-button-secondary: 0 1px 2px 0 rgba(10,13,18,0.05), inset 0 -2px 0 0 rgba(10,13,18,0.05);\n  --ring-focus: 0 0 0 2px var(--blue-400);\n\n  /* ====== Z ====== */\n  --z-dropdown: 50;\n  --z-overlay:  100;\n  --z-modal:    200;\n}\n\n/* =====================================================================\n   Semantic role aliases — components reach for these (h1, p, code…)\n   ===================================================================== */\n:where(body, html) {\n  font-family: var(--font-body);\n  color: var(--fg-primary);\n  background: var(--bg-primary);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\n.cc-display-2xl { font: var(--fw-semibold) var(--text-display-2xl-size)/var(--text-display-2xl-lh) var(--font-display); letter-spacing: var(--text-display-2xl-tracking); color: var(--fg-primary); }\n.cc-display-xl  { font: var(--fw-semibold) var(--text-display-xl-size)/var(--text-display-xl-lh)   var(--font-display); letter-spacing: var(--text-display-xl-tracking);  color: var(--fg-primary); }\n.cc-display-lg  { font: var(--fw-semibold) var(--text-display-lg-size)/var(--text-display-lg-lh)   var(--font-display); letter-spacing: var(--text-display-lg-tracking);  color: var(--fg-primary); }\n.cc-display-md  { font: var(--fw-semibold) var(--text-display-md-size)/var(--text-display-md-lh)   var(--font-display); letter-spacing: var(--text-display-md-tracking);  color: var(--fg-primary); }\n.cc-display-sm  { font: var(--fw-semibold) var(--text-display-sm-size)/var(--text-display-sm-lh)   var(--font-display); color: var(--fg-primary); }\n.cc-display-xs  { font: var(--fw-semibold) var(--text-display-xs-size)/var(--text-display-xs-lh)   var(--font-display); color: var(--fg-primary); }\n\n.cc-h1 { font: var(--fw-semibold) 30px/38px var(--font-display); letter-spacing: -0.01em; color: var(--fg-primary); }\n.cc-h2 { font: var(--fw-semibold) 24px/32px var(--font-display); color: var(--fg-primary); }\n.cc-h3 { font: var(--fw-semibold) 20px/30px var(--font-display); color: var(--fg-primary); }\n.cc-h4 { font: var(--fw-semibold) 18px/28px var(--font-display); color: var(--fg-primary); }\n\n.cc-text-xl { font: var(--fw-regular) var(--text-xl-size)/var(--text-xl-lh) var(--font-body); color: var(--fg-primary); }\n.cc-text-lg { font: var(--fw-regular) var(--text-lg-size)/var(--text-lg-lh) var(--font-body); color: var(--fg-primary); }\n.cc-text-md { font: var(--fw-regular) var(--text-md-size)/var(--text-md-lh) var(--font-body); color: var(--fg-primary); }\n.cc-text-sm { font: var(--fw-regular) var(--text-sm-size)/var(--text-sm-lh) var(--font-body); color: var(--fg-primary); }\n.cc-text-15 { font: var(--fw-regular) var(--text-15-size)/var(--text-15-lh) var(--font-body); color: var(--fg-primary); }\n.cc-text-xs { font: var(--fw-regular) var(--text-xs-size)/var(--text-xs-lh) var(--font-body); color: var(--fg-primary); }\n\n.cc-label    { font: var(--fw-medium) 14px/20px var(--font-body); color: var(--gray-700); }\n.cc-eyebrow  { font: var(--fw-medium) 14px/20px var(--font-body); color: var(--gray-500); text-transform: none; }\n.cc-mono     { font: var(--fw-regular) 14px/20px var(--font-mono); color: var(--fg-primary); }\n.cc-code     { font: var(--fw-regular) 13px/20px var(--font-mono); background: var(--gray-100); padding: 2px 6px; border-radius: var(--radius-xs); color: var(--gray-800); }\n<\u002Fstyle>\n<link rel=\"stylesheet\" href=\"design-system/tokens.css\" data-cc-shared-tokens>\n<script src=\"f423810b-2507-4bfd-8d4f-efc3a0141ddf\"><\u002Fscript>\n<style>\nbody { margin: 0; background: #fff; }\na { color: #901414; }\na:hover { color: #6e0f0f; }\n@keyframes vhu-spin { to { transform: rotate(360deg); } }\n@keyframes vhu-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }\n:where(:focus-visible) { outline: 2px solid var(--blue-500); outline-offset: 2px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; display: flex; flex-direction: column; font-family: var(--font-body); color: var(--gray-900);\">\n\n  <header style=\"border-bottom: 1px solid var(--gray-200);\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px;\">\n      <a href=\"#\" style=\"display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--gray-900);\">\n        <img src=\"12ef669c-f302-4d2f-8a24-02064e046bbf\" alt=\"\" style=\"display: block; height: 40px; width: auto;\">\n        <span style=\"font: var(--fw-bold) 19px/24px var(--font-body); letter-spacing: -0.01em;\">Virginia Hanock University<\u002Fspan>\n      <\u002Fa>\n      <button type=\"button\" aria-label=\"Search\" style=\"width: 44px; height: 44px; border-radius: 9999px; border: none; background: #901414; color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;\" style-hover=\"background: #6e0f0f;\">\n        <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 21l-4.35-4.35M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"border-bottom: 1px solid var(--gray-200);\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 20px 24px 0;\">\n      <div style=\"font: var(--fw-bold) 22px/28px var(--font-body); letter-spacing: -0.01em; margin-bottom: 12px;\">Certified Credentials<\u002Fdiv>\n      <nav aria-label=\"Certified Credentials\" style=\"display: flex; gap: 4px; overflow-x: auto;\">\n        <a href=\"vhu-replacement-diploma.dc.html\" style=\"padding: 10px 14px 12px; font: var(--fw-medium) 15px/20px var(--font-body); color: var(--gray-600); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\" style-hover=\"color: var(--gray-900);\">Your credentials<\u002Fa>\n        <a href=\"vhu-credential-validation.dc.html\" aria-current=\"page\" style=\"padding: 10px 14px 12px; font: var(--fw-semibold) 15px/20px var(--font-body); color: var(--gray-900); text-decoration: none; border-bottom: 3px solid #901414; white-space: nowrap;\">Credential validation<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <main style=\"flex: 1; width: 100%; box-sizing: border-box; max-width: 1120px; margin: 0 auto; padding: 24px 24px 56px;\">\n    <nav aria-label=\"Breadcrumb\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: var(--fw-regular) 13px/18px var(--font-body); color: var(--gray-500); margin-bottom: 20px;\">\n      <a href=\"#\" style=\"color: #901414; text-decoration: none;\">Home<\u002Fa>\n      <span aria-hidden=\"true\">/<\u002Fspan>\n      <a href=\"vhu-replacement-diploma.dc.html\" style=\"color: #901414; text-decoration: none;\">Certified Credentials<\u002Fa>\n      <span aria-hidden=\"true\">/<\u002Fspan>\n      <span style=\"color: var(--gray-700);\">Credential validation<\u002Fspan>\n    <\u002Fnav>\n\n    <h1 style=\"font: var(--fw-bold) 40px/48px var(--font-body); letter-spacing: -0.02em; margin: 0 0 12px; text-wrap: balance;\">Credential validation<\u002Fh1>\n    <p style=\"font: var(--fw-regular) 17px/26px var(--font-body); color: var(--gray-600); margin: 0 0 32px; max-width: 620px; text-wrap: pretty;\">Enter the CeDiD to confirm that a credential was issued by Virginia Hanock University.<\u002Fp>\n\n    <div style=\"max-width: 620px;\">\n      <form sc-camel-on-submit=\"{{ onSubmit }}\" novalidate=\"\" style=\"display: flex; flex-direction: column; gap: 8px;\">\n        <label for=\"vhu-cid\" style=\"font: var(--fw-semibold) 15px/20px var(--font-body); color: var(--gray-900);\">CeDiD<\u002Flabel>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px;\">\n          <div style=\"{{ fieldWrapStyle }}\">\n            <div aria-hidden=\"true\" style=\"position: absolute; inset: 0; padding: 0 14px; display: flex; align-items: center; pointer-events: none; font: var(--fw-medium) 16px/24px var(--font-mono); letter-spacing: 0.04em; white-space: pre; overflow: hidden;\"><span style=\"color: transparent;\">{{ q }}<\u002Fspan><span style=\"color: var(--gray-500);\">{{ ghostRest }}<\u002Fspan><\u002Fdiv>\n            <input id=\"vhu-cid\" value=\"{{ q }}\" sc-camel-on-change=\"{{ onInput }}\" sc-camel-auto-complete=\"off\" sc-camel-auto-capitalize=\"characters\" sc-camel-spell-check=\"false\" sc-camel-max-length=\"14\" aria-invalid=\"{{ invalidAria }}\" aria-describedby=\"vhu-cid-help vhu-cid-err\" style=\"{{ inputStyle }}\">\n          <\u002Fdiv>\n          <button type=\"submit\" disabled=\"{{ loading }}\" style=\"{{ submitStyle }}\" style-hover=\"background: #6e0f0f;\">\n            <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ false }}\">{{ spinner }}<\u002Fsc-if>\n            {{ submitLabel }}\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div id=\"vhu-cid-err\" role=\"alert\" style=\"display: flex; align-items: flex-start; gap: 6px; font: var(--fw-regular) 14px/20px var(--font-body); color: var(--error-700);\">\n            <svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M12 8v4m0 4h.01M22 12c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2s10 4.477 10 10Z\"><\u002Fpath><\u002Fsvg>\n            <span style=\"text-wrap: pretty;\">{{ errText }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div id=\"vhu-cid-help\" style=\"font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-600); text-wrap: pretty;\">12 letters and numbers. Not case sensitive.<\u002Fdiv>\n      <\u002Fform>\n\n      <sc-if value=\"{{ valid }}\" hint-placeholder-val=\"{{ false }}\">\n        <section aria-live=\"polite\" aria-labelledby=\"vhu-res-title\" style=\"margin-top: 32px; border: 1px solid var(--gray-200); border-radius: 12px; box-shadow: var(--shadow-xs); overflow: hidden; animation: vhu-in .24s cubic-bezier(.2,.6,.2,1);\">\n          <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 20px; background: var(--success-50); border-bottom: 1px solid var(--success-200);\">\n            \n            <div style=\"min-width: 0;\">\n              <h2 id=\"vhu-res-title\" style=\"font: var(--fw-semibold) 18px/26px var(--font-body); color: var(--success-700); margin: 0;\">Valid credential<\u002Fh2>\n              <p style=\"font: var(--fw-regular) 14px/20px var(--font-body); color: var(--success-700); margin: 2px 0 0; text-wrap: pretty;\">Issued by {{ r.issuer }}. Validated {{ r.at }}.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <dl style=\"margin: 0; padding: 0;\">\n            <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"6\">\n              <div style=\"{{ row.style }}\">\n                <dt style=\"flex: 0 0 160px; font: var(--fw-regular) 14px/20px var(--font-body); color: var(--gray-600);\">{{ row.label }}<\u002Fdt>\n                <dd style=\"{{ row.valStyle }}\">{{ row.value }}<\u002Fdd>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdl>\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 20px; border-top: 1px solid var(--gray-200); background: var(--gray-50);\">\n            \n            <button type=\"button\" sc-camel-on-click=\"{{ onReset }}\" style=\"height: 40px; padding: 0 4px; background: none; border: none; font: var(--fw-semibold) 14px/20px var(--font-body); color: #901414; cursor: pointer;\" style-hover=\"color: #6e0f0f; text-decoration: underline;\">Validate another ID<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <div style=\"display: flex; align-items: center; gap: 4px; margin-top: 28px;\">\n        <span style=\"font: var(--fw-regular) 12px/16px var(--font-body); color: var(--gray-500);\">Powered by<\u002Fspan>\n        <a href=\"https://www.paradigm.com\" target=\"_blank\" rel=\"noopener\" aria-label=\"Paradigm (opens in a new tab)\" style=\"display: inline-flex;\"><img src=\"48c1a878-53c8-44f2-940d-5b3e04f481fc\" alt=\"Paradigm\" style=\"display: block; height: 22px; width: auto;\"><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border-top: 1px solid var(--gray-200); margin-top: 48px; padding-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 32px;\">\n      <div>\n        <h2 style=\"font: var(--fw-semibold) 18px/26px var(--font-body); margin: 0 0 8px;\">Apostille<\u002Fh2>\n        <p style=\"font: var(--fw-regular) 15px/24px var(--font-body); color: var(--gray-700); margin: 0; text-wrap: pretty;\">An apostille is usually not required. Virginia Hanock University digital diplomas and certificates have legal standing, cannot be repudiated, and can be validated on this page at any time. For questions, contact <a href=\"mailto:credentials@vhu.edu\">Certified Credentials<\u002Fa>.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h2 style=\"font: var(--fw-semibold) 18px/26px var(--font-body); margin: 0 0 8px;\">Accreditation<\u002Fh2>\n        <p style=\"font: var(--fw-regular) 15px/24px var(--font-body); color: var(--gray-700); margin: 0; text-wrap: pretty;\">You can check institutional accreditation through the <a href=\"https://www.chea.org/search-institutions\" target=\"_blank\" rel=\"noopener\">Council for Higher Education Accreditation (CHEA)<\u002Fa>. CHEA is an independent, non-profit organization and is not affiliated with Paradigm.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <footer style=\"background: #6e0f0f; color: #fff;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font: var(--fw-regular) 14px/20px var(--font-body);\">\n      <span>© 2026 Virginia Hanock University<\u002Fspan>\n      <span>Certified Credentials · credentials@vhu.edu<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n  <dc-import name=\"Proto-Rail\" current=\"validation\" hint-size=\"0px,0px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script>\nclass Component extends DCLogic {\n  static RECORDS = [\n    [\"7K4M-2Q9P-B3XE\", \"Certificate of Completion\", \"Data Analytics\", \"January 4, 2026\", \"January 8, 2026\", \"Virginia Hanock University\"],\n    [\"3HTR-8W2N-K6YD\", \"Certificate of Specialization\", \"Applied Machine Learning\", \"November 6, 2025\", \"November 12, 2025\", \"Virginia Hanock University\"],\n    [\"9PXF-4C7J-R2MA\", \"Certificate of Achievement\", \"Database Systems\", \"February 9, 2026\", \"February 14, 2026\", \"Virginia Hanock University\"],\n    [\"5DGV-1N8K-T4QW\", \"Bachelor of Science\", \"Information Systems\", \"March 10, 2025\", \"March 15, 2025\", \"Virginia Hanock University\"],\n    [\"6YBN-3R5P-H8KC\", \"Python for Data Science\", \"Micro-credential\", \"May 29, 2026\", \"June 3, 2026\", \"Virginia Hanock University\"],\n    [\"2MJW-7T4X-E9RF\", \"Certificate of Completion\", \"Project Management\", \"June 12, 2026\", \"June 17, 2026\", \"Virginia Hanock University\"],\n    [\"8CQK-5V2H-N7LD\", \"Certificate of Specialization\", \"Cybersecurity Fundamentals\", \"April 24, 2026\", \"April 29, 2026\", \"Virginia Hanock University\"],\n    [\"4BAT-9F6M-W3PZ\", \"Certificate of Achievement\", \"Business Analytics\", \"August 8, 2026\", \"August 13, 2026\", \"Virginia Hanock University\"],\n    [\"1RLE-6K3D-Y5VG\", \"Certificate of Completion\", \"Digital Marketing\", \"May 15, 2026\", \"May 20, 2026\", \"Virginia Hanock University\"],\n  ];\n  static ALIASES = { \"MW-COC-4B2E1\": \"7K4M-2Q9P-B3XE\", \"MW-COS-7F3A9\": \"3HTR-8W2N-K6YD\", \"MW-COA-9D5C2\": \"9PXF-4C7J-R2MA\", \"MW-VHU-DP-2K9\": \"5DGV-1N8K-T4QW\", \"MW-PY-2A6C9\": \"6YBN-3R5P-H8KC\", \"MW-PM-3C8D1\": \"2MJW-7T4X-E9RF\", \"MW-CYB-5E7A2\": \"8CQK-5V2H-N7LD\", \"MW-BA-8F1B4\": \"4BAT-9F6M-W3PZ\", \"MW-DM-7B3E5\": \"1RLE-6K3D-Y5VG\" };\n  state = { q: \"\", status: \"idle\", result: null, copied: false };\n  fmt(v) { const c = (v || \"\").toUpperCase().replace(/[^A-Z0-9]/g, \"\").slice(0, 12); return c.replace(/(.{4})(?=.)/g, \"$1-\"); }\n  norm(v) { return (v || \"\").toUpperCase().replace(/[^A-Z0-9]/g, \"\"); }\n  stamp() { const n = new Date(); return n.toLocaleDateString(\"en-US\", { month: \"long\", day: \"numeric\", year: \"numeric\" }) + \" at \" + n.toLocaleTimeString(\"en-US\", { hour: \"numeric\", minute: \"2-digit\" }); }\n  componentDidMount() {\n    const p = Object.fromEntries(new URLSearchParams(location.search));\n    let src = p.id ? p : null;\n    if (!src || !src.id) return;\n    const alias = Component.ALIASES[(src.id || \"\").toUpperCase()];\n    if (alias) src = { ...src, id: alias };\n    const rec = Component.RECORDS.find((r) => this.norm(r[0]) === this.norm(src.id));\n    const id = rec ? rec[0] : this.fmt(src.id);\n    this.setState({ q: id, status: \"valid\", result: { id, name: src.name || (rec && rec[1]) || \"Certificate\", program: src.program || (rec && rec[2]) || \"\", earned: src.earned || (rec && rec[3]) || \"\", issued: src.issued || (rec && rec[4]) || \"\", issuer: src.issuer || (rec && rec[5]) || \"Virginia Hanock University\", at: this.stamp() } });\n  }\n  componentWillUnmount() { clearTimeout(this.t); }\n  validate() {\n    const q = this.state.q.trim();\n    if (!q) return this.setState({ status: \"empty\", result: null });\n    this.setState({ status: \"loading\", result: null, copied: false });\n    clearTimeout(this.t);\n    this.t = setTimeout(() => {\n      const rec = Component.RECORDS.find((r) => this.norm(r[0]) === this.norm(q));\n      if (!rec) return this.setState({ status: \"notfound\" });\n      const at = this.stamp();\n      this.setState({ status: \"valid\", q: rec[0], result: { id: rec[0], name: rec[1], program: rec[2], earned: rec[3], issued: rec[4], issuer: rec[5], at } });\n    }, 700);\n  }\n  renderVals() {\n    const { q, status, result: r, copied } = this.state;\n    const loading = status === \"loading\";\n    const err = status === \"empty\" || status === \"notfound\";\n    const rows = r ? [\n      [\"Name\", \"Maya Wright\", true],\n      [\"Credential\", r.name, true],\n      [\"Date issued\", r.issued],\n      [\"CeDiD\", r.id, false, true],\n    ].map(([label, value, strong, mono], i, a) => ({\n      label, value,\n      style: { display: \"flex\", flexWrap: \"wrap\", gap: \"2px 16px\", padding: \"12px 20px\", borderBottom: i < a.length - 1 ? \"1px solid var(--gray-200)\" : \"none\" },\n      valStyle: { flex: \"1 1 220px\", minWidth: 0, margin: 0, font: (strong ? \"var(--fw-semibold)\" : \"var(--fw-medium)\") + \" 14px/20px \" + (mono ? \"var(--font-mono)\" : \"var(--font-body)\"), color: \"var(--gray-900)\", wordBreak: \"break-word\" },\n    })) : [];\n    return {\n      q, loading, valid: status === \"valid\" && !!r, r: r || {}, rows, hasErr: err,\n      invalidAria: String(err),\n      errText: status === \"empty\" ? \"Enter a CeDiD.\" : \"No credential matches \" + q.trim().toUpperCase() + \". Check the ID and try again, or contact Certified Credentials.\",\n      submitLabel: loading ? \"Validating\" : \"Validate\",\n      spinner: React.createElement(\"span\", { \"aria-hidden\": true, style: { width: 16, height: 16, borderRadius: 9999, border: \"2px solid rgba(255,255,255,0.4)\", borderTopColor: \"#fff\", animation: \"vhu-spin .7s linear infinite\", display: \"inline-block\" } }),\n      copyLabel: copied ? \"Link copied\" : \"Copy validation link\",\n      fieldWrapStyle: { position: \"relative\", flex: \"1 1 260px\", minWidth: 0, height: 48, borderRadius: \"var(--radius-md)\", background: \"#fff\" },\n      ghostRest: \"XXXX-XXXX-XXXX\".slice(q.length),\n      inputStyle: { position: \"relative\", width: \"100%\", height: 48, boxSizing: \"border-box\", padding: \"0 14px\", border: \"none\", borderRadius: \"var(--radius-md)\", background: \"transparent\", outline: \"none\", font: \"var(--fw-medium) 16px/24px var(--font-mono)\", letterSpacing: \"0.04em\", color: \"var(--gray-900)\", boxShadow: err ? \"inset 0 0 0 1px var(--error-500)\" : \"inset 0 0 0 1px var(--gray-300), var(--shadow-xs)\" },\n      submitStyle: { display: \"inline-flex\", alignItems: \"center\", justifyContent: \"center\", gap: 8, height: 48, minWidth: 128, padding: \"0 20px\", border: \"none\", borderRadius: \"var(--radius-md)\", background: \"#901414\", color: \"#fff\", font: \"var(--fw-semibold) 16px/24px var(--font-body)\", cursor: loading ? \"progress\" : \"pointer\", opacity: loading ? 0.85 : 1 },\n      onInput: (e) => this.setState({ q: this.fmt(e.target.value), status: status === \"valid\" ? \"idle\" : (err ? \"idle\" : status), result: status === \"valid\" ? null : r }),\n      onSubmit: (e) => { e.preventDefault(); if (!loading) this.validate(); },\n      onCopyLink: () => { const url = location.href.split(\"?\")[0] + \"?\" + new URLSearchParams({ id: r.id, name: r.name, program: r.program, earned: r.earned, issued: r.issued, issuer: r.issuer }).toString(); try { navigator.clipboard.writeText(url); } catch (x) {} this.setState({ copied: true }); },\n      onReset: () => { this.setState({ q: \"\", status: \"idle\", result: null, copied: false }); setTimeout(() => document.getElementById(\"vhu-cid\")?.focus(), 0); },\n    };\n  }\n}\n<\u002Fscript>\n<\u002Fbody>\n<\u002Fhtml>\n"</script>
